name: Stage 229 NeXium deterministic replay input count

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage229-nexium-replay-meter.yml'
      - 'tools/foj_stage229_meter_guest_check.py'
      - 'tools/foj_stage226_nexium_drive.sh'
      - 'tests/emulator/test_stage229_meter_guest_check.py'
      - 'switch/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage229-nexium-replay-meter.yml'
      - 'tools/foj_stage229_meter_guest_check.py'
      - 'tools/foj_stage226_nexium_drive.sh'
      - 'tests/emulator/test_stage229_meter_guest_check.py'
      - 'switch/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  build:
    name: Build synthetic NRO with visible replay-input meter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate real interactive battle NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-isometric-research.nro
          python3 tools/validate_nro.py build/foj-isometric-research.nro
      - name: Publish generated-only guest executable
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage229-synthetic-replay-meter-nro
          path: build/foj-isometric-research.nro
          if-no-files-found: error

  nexium:
    name: Verify actual NeXium A/B controller replay counts
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage229-synthetic-replay-meter-nro
          path: nros
      - name: Install headless Vulkan and screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Stage229 strict C11 replay input meter regressions
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_battle_replay_meter.c core/battle_replay_meter.c \
            core/battle_replay.c core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj229_meter_test
          /tmp/foj229_meter_test
      - name: Stage229 UBSan replay counter memory guard
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_battle_replay_meter.c core/battle_replay_meter.c \
            core/battle_replay.c core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj229_meter_ubsan
          /tmp/foj229_meter_ubsan
      - name: Obtain pinned NeXium nightly and record digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium runtime-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Regress screenshot verifier against six generated cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage229_meter_guest_check.py' -v
      - name: Launch and press A then B then alternate A in actual guest
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-research.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence"
          test -s "$FOJ_NRO"
          timeout --kill-after=5s 230s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage226_nexium_drive.sh
      - name: Require actual NeXium replay count increases with each control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage229_meter_guest_check \
            --initial runtime-evidence/hero-initial.png \
            --moved runtime-evidence/hero-moved.png \
            --undone runtime-evidence/hero-undone.png \
            --alternate runtime-evidence/hero-alternate.png \
            --report runtime-evidence/stage229-input-count-receipt.json
      - name: Preserve actual synthetic guest screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage229-nexium-replay-meter-evidence
          path: runtime-evidence/
          if-no-files-found: warn
