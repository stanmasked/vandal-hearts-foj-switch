name: Stage 227 NeXium complete synthetic battle victory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage227-nexium-victory.yml'
      - 'tools/foj_stage227_victory_guest_check.py'
      - 'tools/foj_stage227_nexium_drive.sh'
      - 'tests/emulator/test_stage227_victory_guest_check.py'
      - 'switch/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage227-nexium-victory.yml'
      - 'tools/foj_stage227_victory_guest_check.py'
      - 'tools/foj_stage227_nexium_drive.sh'
      - 'tests/emulator/test_stage227_victory_guest_check.py'
      - 'switch/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  build:
    name: Build generated-only complete tactical battle NRO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate real interactive battle NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-isometric-research.nro
          python3 tools/validate_nro.py build/foj-isometric-research.nro
      - name: Publish generated-only guest executable
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage227-synthetic-victory-nro
          path: build/foj-isometric-research.nro
          if-no-files-found: error

  nexium:
    name: Verify real NeXium battle from approach through terminal victory
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage227-synthetic-victory-nro
          path: nros
      - name: Install headless Vulkan and screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Obtain pinned NeXium nightly and record digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium runtime-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Regress screenshot verifier against eleven synthetic cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage227_victory_guest_check.py' -v
      - name: Launch and complete two-hit synthetic battle in actual guest
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-research.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence"
          test -s "$FOJ_NRO"
          timeout --kill-after=5s 230s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage227_nexium_drive.sh
      - name: Require two real attacks, received damage and terminal victory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage227_victory_guest_check \
            --initial runtime-evidence/battle-initial.png \
            --after-turn1 runtime-evidence/battle-turn1.png \
            --after-hit1 runtime-evidence/battle-hit1.png \
            --after-turn2 runtime-evidence/battle-turn2.png \
            --victory runtime-evidence/battle-victory.png \
            --after-terminal-y runtime-evidence/battle-terminal-y.png \
            --report runtime-evidence/stage227-guest-victory-receipt.json
      - name: Preserve actual synthetic guest screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage227-nexium-victory-evidence
          path: runtime-evidence/
          if-no-files-found: warn
