name: Stage298 inverse tile and ambiguous pixel-witness gate (synthetic)

on:
  pull_request:
    paths:
      - '.github/workflows/stage298-inverse-tile-ambiguity.yml'
      - 'tools/foj_stage298_inverse_tile_ambiguity.py'
      - 'tests/emulator/test_stage298_inverse_tile_ambiguity.py'
      - 'tools/foj_stage297_private_tile_reference_gate.py'
      - 'tools/foj_stage295_owner_local_source_integrity.py'
      - 'tools/foj_fd_bound_reader.py'
      - 'docs/GPU_STAGE298_INVERSE_TILE_AMBIGUITY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage298-inverse-ambiguity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-ambiguity:
    name: Inverse provenance and full layout ambiguity / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify ambiguity refusal, byte-preserving inverse, privacy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/foj_stage298_inverse_tile_ambiguity.py
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage298_inverse_tile_ambiguity.py' -v
          echo STAGE298_SYNTHETIC_INVERSE_AND_AMBIGUITY_PASS
      # Only public invented fixtures. Never upload source assets or any RGBA output.
