name: Stage307 real NeXium GPU nearest vs linear BC1 filtering

on:
  pull_request:
    paths:
      - '.github/workflows/stage307-nearest-linear-bc1-filter.yml'
      - 'gpu/stage307_filter_compare.mk'
      - 'gpu/deko3d_clear_main.c'
      - 'tools/foj_stage307_filter_gpu_compare.py'
      - 'tests/emulator/test_stage307_filter_gpu_compare.py'
      - 'docs/GPU_STAGE307_NEAREST_LINEAR_BC1_GPU.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: stage307-bc1-filter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Native generated texture and filter-evidence safety / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: ['gcc','clang']
    steps:
      - uses: actions/checkout@v4
      - name: Actual native C eight-band BC1 generator with strict input guard
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Werror -Igpu -Icore \
            -DFOJ_GPU_THREE_LAYER_BLEND=1 \
            gpu/atlas_dds.c gpu/bc1_atlas_page.c gpu/stage303_bc1_page_uv.c \
            gpu/stage306_patterned_gpu_scene.c \
            tests/gpu/test_stage306_patterned_gpu_scene.c -lm \
            -o /tmp/stage307-pattern-generator
          /tmp/stage307-pattern-generator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse bogus nearest/linear GPU frames and leaked private files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage307_filter_gpu_compare.py' -v
          echo STAGE307_HOST_BC1_FILTER_EVIDENCE_NEGATIVE_PASS

  build:
    name: Two explicit native deko3d sampler NROs via devkitA64
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile nearest and linear min+mag sampler versions
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/stage307_filter_compare.mk STAGE307_FILTER=0 OUT=build/foj-stage307-nearest verify
          make -f gpu/stage307_filter_compare.mk STAGE307_FILTER=1 OUT=build/foj-stage307-linear verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-stage307-nearest.nro
          python3 tools/validate_nro.py build/foj-stage307-linear.nro
          echo STAGE307_DEVKITA64_NEAREST_LINEAR_NRO_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage307-two-nro-and-dksh
          path: |
            build/foj-stage307-nearest.nro
            build/foj-stage307-linear.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Render two real GPU frames with explicit ${{ matrix.mode }} sampling
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [nearest, linear]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage307-two-nro-and-dksh
          path: native
      - name: Install NeXium graphics dependencies and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Bind exact downloaded NeXium binary release SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Stage293 synthetic materials and unchanged DDS attestations
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          work="$RUNNER_TEMP/stage307-invented-bc1"
          evidence="$GITHUB_WORKSPACE/runtime-evidence/bridge"
          python3 -m tools.foj_stage293_converted_dds_guest prepare \
            --work-root "$work" --shaders native/gpu/build --evidence "$evidence"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$work" --evidence "$evidence" --phase before
          echo "NEXIUM_DATA_ROOT=$work/staged" >> "$GITHUB_ENV"
          echo "FOJ_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
      - name: Capture actual nearest/linear GPU frames with distinct native sampler receipt
        shell: bash
        run: |
          set -euo pipefail
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-stage307-${{ matrix.mode }}.nro"
          sd="$NEXIUM_DATA_ROOT/sdmc/switch/foj/gpu"
          test ! -e "$sd/foj-native-stage307-filter-pass.txt"
          timeout --kill-after=5s 270s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage306_nexium_drive.sh
          mode_marker="$sd/foj-native-stage307-filter-pass.txt"
          test -f "$mode_marker" && test ! -L "$mode_marker"
          cp -- "$mode_marker" "$FOJ_EVIDENCE_DIR/native-stage307-filter-pass.txt"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$(dirname "$NEXIUM_DATA_ROOT")" \
            --evidence "$FOJ_EVIDENCE_DIR" --phase after
      - name: Audit actual NeXium GPU pictures and stage307 sampler metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage306_patterned_uv_guest audit \
            --evidence runtime-evidence/bridge
          python3 -m tools.foj_stage307_filter_gpu_compare audit \
            --mode ${{ matrix.mode }} --root runtime-evidence/bridge
          python3 -m tools.foj_stage307_filter_gpu_compare publish \
            --mode ${{ matrix.mode }} --source runtime-evidence \
            --output runtime-evidence-public
          echo STAGE307_REAL_NEIXUM_GENERATED_FILTER_MODE_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foj-stage307-filter-${{ matrix.mode }}-gpu-evidence
          path: runtime-evidence-public/
          if-no-files-found: error

  compare:
    name: Independent paired four-frame nearest vs linear GPU edge proof
    needs: nexium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage307-filter-nearest-gpu-evidence
          path: nearest
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage307-filter-linear-gpu-evidence
          path: linear
      - name: Detect linear intermediate band colors vs unchanged nearest colors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          python3 -m tools.foj_stage307_filter_gpu_compare compare \
            --nearest nearest --linear linear
          echo STAGE307_REAL_NEIXUM_TWO_FILTER_MODES_DIFFER_AT_BC1_EDGES_PASS
