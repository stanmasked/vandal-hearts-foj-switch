name: Research tools tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Synthetic tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile research tools
        run: python -m compileall -q tools tests
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI help
        run: |
          python tools/inspect_pkg.py --help
          python -m tools.inspect_split_pkg --help
      - name: Validate DDS BGRA8 and BC1/DXT1 decoders
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_dds_texture.c core/dds_texture.c -o /tmp/foj_dds
          /tmp/foj_dds
      - name: DDS parser sanitizer smoke test
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_dds_texture.c core/dds_texture.c -o /tmp/foj_dds_asan
          /tmp/foj_dds_asan

      - name: Validate OBJ first-shape reader and wireframe view
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_obj_wireframe.c core/obj_wireframe.c -lm -o /tmp/foj_obj
          /tmp/foj_obj

      - name: Validate original BANIM native reader and local animation sampling
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_banim_core.c core/banim_core.c -lm -o /tmp/foj_banim_core
          /tmp/foj_banim_core
      - name: Check BANIM native parser with ASan and UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_banim_core.c core/banim_core.c -lm -o /tmp/foj_banim_asan
          /tmp/foj_banim_asan

      - name: Validate inverse bind matrices and CPU weighted skinning
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_skeletal_skin.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_skeletal_skin_tests
          /tmp/foj_skeletal_skin_tests
      - name: Check CPU skinning with address and undefined-behavior sanitizers
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_skeletal_skin.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_skinning_asan
          /tmp/foj_skinning_asan

      - name: Validate private FOJRM001 rigged mesh import
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_rigmesh_io.c core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_rigmesh_io
          /tmp/foj_rigmesh_io
      - name: Check FOJRM001 binary reader with ASan and UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_rigmesh_io.c core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_rigmesh_sanitized
          /tmp/foj_rigmesh_sanitized

      - name: Validate CPU UV textured triangles and depth buffer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_textured_triangles.c core/textured_triangles.c \
            -lm -o /tmp/foj_textured_triangles
          /tmp/foj_textured_triangles
      - name: Check textured rasterizer with ASan and UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_textured_triangles.c core/textured_triangles.c \
            -lm -o /tmp/foj_textured_triangles_asan
          /tmp/foj_textured_triangles_asan

      - name: Validate private multi-material FOJMAT01 mapping
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_material_table.c core/material_table.c -o /tmp/foj_material_map
          /tmp/foj_material_map
      - name: Sanitize private multi-material FOJMAT01 mapping
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_material_table.c core/material_table.c -o /tmp/foj_material_asan
          /tmp/foj_material_asan

      - name: Validate CPU-to-GPU clip-space and original material draw staging
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_gpu_vertex_stream.c core/gpu_vertex_stream.c \
            -lm -o /tmp/foj_gpu_stage
          /tmp/foj_gpu_stage
      - name: Sanitize CPU-to-GPU vertex staging
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_gpu_vertex_stream.c core/gpu_vertex_stream.c \
            -lm -o /tmp/foj_gpu_stage_asan
          /tmp/foj_gpu_stage_asan

      - name: Validate GPU framebuffer alignment and persistent color command plans
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Igpu \
            tests/test_gpu_smoke_plan.c gpu/smoke_plan.c \
            -lm -o /tmp/foj_gpu_clear_math
          /tmp/foj_gpu_clear_math
      - name: Address/undefined-behavior checks on portable GPU smoke math
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Igpu \
            tests/test_gpu_smoke_plan.c gpu/smoke_plan.c \
            -lm -o /tmp/foj_gpu_clear_math_asan
          /tmp/foj_gpu_clear_math_asan

      - name: Execute the actual deko3d NRO source with a stateful host API mock
        run: |
          make -f gpu/clear.mk host-check
      - name: Sanitize fake deko3d resource lifecycle and fault injection
        run: |
          make -f gpu/clear.mk host-mock-sanitized

      - name: Compile and run portable tactical logic tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_tactical_demo.c core/tactical_demo.c -o /tmp/foj_tactics_tests
          /tmp/foj_tactics_tests
      - name: Compile portable FoJ COLL parser under strict C11 flags
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_coll_grid.c core/coll_grid.c -lm -o /tmp/foj_coll_tests
          /tmp/foj_coll_tests
      - name: Check COLL parser with address and undefined-behavior sanitizers
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_coll_grid.c core/coll_grid.c -lm -o /tmp/foj_coll_sanitized
          /tmp/foj_coll_sanitized

      - name: Compile user-local COLL validator CLI
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tools/coll_validate_local.c core/coll_grid.c -lm -o /tmp/foj_coll_validate
          /tmp/foj_coll_validate --help

      - name: Validate 50x50 COLL heatmap and raw flag channels
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_coll_view.c core/coll_view.c -lm -o /tmp/foj_coll_view_test
          /tmp/foj_coll_view_test

      - name: Compile and run isometric rendering tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_isometric_demo.c core/isometric_demo.c core/tactical_demo.c \
            -o /tmp/foj_iso_tests
          /tmp/foj_iso_tests

# No game packages, console keys, third-party assets, or decryption used in CI.
