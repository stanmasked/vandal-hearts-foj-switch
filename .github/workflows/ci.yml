name: Research tools tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Synthetic tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile research tools
        run: python -m compileall -q tools tests
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI help
        run: |
          python tools/inspect_pkg.py --help
          python -m tools.inspect_split_pkg --help
      - name: Compile and run portable tactical logic tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_tactical_demo.c core/tactical_demo.c -o /tmp/foj_tactics_tests
          /tmp/foj_tactics_tests
      - name: Compile and run isometric rendering tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_isometric_demo.c core/isometric_demo.c core/tactical_demo.c \
            -o /tmp/foj_iso_tests
          /tmp/foj_iso_tests

# No game packages, console keys, third-party assets, or decryption used in CI.
