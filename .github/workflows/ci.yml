name: Research tools tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foj-research-tools-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  test:
    name: Synthetic tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML syntax
        if: matrix.python == '3.11'
        shell: bash
        run: |
          ruby -ryaml -e 'Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |file| YAML.parse_file(file); puts "YAML syntax OK: #{file}" }'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile research tools
        run: python -m compileall -q tools tests
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI help
        run: |
          python tools/inspect_pkg.py --help
          python -m tools.inspect_split_pkg --help
      - name: Validate DDS BGRA8 and BC1/DXT1 decoders
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_dds_texture.c core/dds_texture.c -o /tmp/foj_dds
          /tmp/foj_dds
      - name: DDS parser sanitizer smoke test
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_dds_texture.c core/dds_texture.c -o /tmp/foj_dds_asan
          /tmp/foj_dds_asan

      - name: Validate OBJ first-shape reader and wireframe view
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_obj_wireframe.c core/obj_wireframe.c -lm -o /tmp/foj_obj
          /tmp/foj_obj

      - name: Validate original BANIM native reader and local animation sampling
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_banim_core.c core/banim_core.c -lm -o /tmp/foj_banim_core
          /tmp/foj_banim_core
      - name: Check BANIM native parser with ASan and UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_banim_core.c core/banim_core.c -lm -o /tmp/foj_banim_asan
          /tmp/foj_banim_asan

      - name: Validate inverse bind matrices and CPU weighted skinning
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_skeletal_skin.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_skeletal_skin_tests
          /tmp/foj_skeletal_skin_tests
      - name: Check CPU skinning with address and undefined-behavior sanitizers
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_skeletal_skin.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_skinning_asan
          /tmp/foj_skinning_asan

      - name: Validate private FOJRM001 rigged mesh import
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_rigmesh_io.c core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_rigmesh_io
          /tmp/foj_rigmesh_io
      - name: Check FOJRM001 binary reader with ASan and UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_rigmesh_io.c core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            -lm -o /tmp/foj_rigmesh_sanitized
          /tmp/foj_rigmesh_sanitized

      - name: Validate CPU UV textured triangles and depth buffer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_textured_triangles.c core/textured_triangles.c \
            -lm -o /tmp/foj_textured_triangles
          /tmp/foj_textured_triangles
      - name: Check textured rasterizer with ASan and UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_textured_triangles.c core/textured_triangles.c \
            -lm -o /tmp/foj_textured_triangles_asan
          /tmp/foj_textured_triangles_asan

      - name: Validate private multi-material FOJMAT01 mapping
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_material_table.c core/material_table.c -o /tmp/foj_material_map
          /tmp/foj_material_map
      - name: Sanitize private multi-material FOJMAT01 mapping
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_material_table.c core/material_table.c -o /tmp/foj_material_asan
          /tmp/foj_material_asan

      - name: Validate CPU-to-GPU clip-space and original material draw staging
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_gpu_vertex_stream.c core/gpu_vertex_stream.c \
            -lm -o /tmp/foj_gpu_stage
          /tmp/foj_gpu_stage
      - name: Sanitize CPU-to-GPU vertex staging
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_gpu_vertex_stream.c core/gpu_vertex_stream.c \
            -lm -o /tmp/foj_gpu_stage_asan
          /tmp/foj_gpu_stage_asan

      - name: Validate GPU framebuffer alignment and persistent color command plans
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Igpu \
            tests/test_gpu_smoke_plan.c gpu/smoke_plan.c \
            -lm -o /tmp/foj_gpu_clear_math
          /tmp/foj_gpu_clear_math
      - name: Address/undefined-behavior checks on portable GPU smoke math
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Igpu \
            tests/test_gpu_smoke_plan.c gpu/smoke_plan.c \
            -lm -o /tmp/foj_gpu_clear_math_asan
          /tmp/foj_gpu_clear_math_asan

      - name: Execute the actual deko3d NRO source with a stateful host API mock
        run: |
          make -f gpu/clear.mk host-check
      - name: Sanitize fake deko3d resource lifecycle and fault injection
        run: |
          make -f gpu/clear.mk host-mock-sanitized

      - name: Validate disjoint deko3d shader slots and reserved code tail
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Igpu \
            tests/test_shader_layout.c gpu/shader_layout.c \
            -o /tmp/foj_shader_layout
          /tmp/foj_shader_layout
      - name: Sanitize GPU shader slot overflow and failure rollback
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Igpu \
            tests/test_shader_layout.c gpu/shader_layout.c \
            -o /tmp/foj_shader_layout_asan
          /tmp/foj_shader_layout_asan

      - name: Check DKSH stage, program-header bounds and shader file loader
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Igpu \
            tests/test_dksh_module.c gpu/dksh_module.c \
            -o /tmp/foj_dksh_module
          /tmp/foj_dksh_module
      - name: Address/undefined-behavior checks for DKSH shader intake
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Igpu \
            tests/test_dksh_module.c gpu/dksh_module.c \
            -o /tmp/foj_dksh_module_asan
          /tmp/foj_dksh_module_asan

      - name: Type-check shader-backed deko3d XYZW UV draw branch without SDK
        run: |
          make -f gpu/clear.mk host-triangle-check

      - name: Compile and run portable tactical logic tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_tactical_demo.c core/tactical_demo.c -o /tmp/foj_tactics_tests
          /tmp/foj_tactics_tests
      - name: Compile and run Stage217 synthetic battle turns
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_tactical_battle.c core/tactical_battle.c \
            core/tactical_demo.c -o /tmp/foj_battle_tests
          /tmp/foj_battle_tests
      - name: Check synthetic battle turn safety with UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_tactical_battle.c core/tactical_battle.c \
            core/tactical_demo.c -o /tmp/foj_battle_ubsan
          /tmp/foj_battle_ubsan

      - name: Stage228 reproducible battle inputs with strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_battle_replay.c core/battle_replay.c \
            core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj228_battle_replay
          /tmp/foj228_battle_replay
      - name: Stage228 replay boundary checks with UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_battle_replay.c core/battle_replay.c \
            core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj228_battle_replay_ubsan
          /tmp/foj228_battle_replay_ubsan

      - name: Stage236 exhaustive movement preview vs actual replay (C11)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_battle_threat_replay_parity.c core/battle_replay.c \
            core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj236_threat_replay_parity
          /tmp/foj236_threat_replay_parity
      - name: Stage236 movement forecast parity (UBSan)
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_battle_threat_replay_parity.c core/battle_replay.c \
            core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj236_threat_replay_parity_ubsan
          /tmp/foj236_threat_replay_parity_ubsan

      - name: Stage237 threat preview caching and pixel parity (C11)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_battle_threat_cache.c core/isometric_demo.c \
            core/battle_replay.c core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj237_threat_cache
          /tmp/foj237_threat_cache
      - name: Stage237 cache and rendering parity (UBSan)
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_battle_threat_cache.c core/isometric_demo.c \
            core/battle_replay.c core/tactical_battle.c core/tactical_demo.c \
            -o /tmp/foj237_threat_cache_ubsan
          /tmp/foj237_threat_cache_ubsan

      - name: Stage239 measure host forecast costs (monotonic C11 / GCC)
        run: |
          set -euo pipefail
          mkdir -p timing-evidence
          cc -std=c11 -O2 -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_battle_threat_cost.c core/tactical_battle.c \
            core/tactical_demo.c -o /tmp/foj239_host_cost
          /tmp/foj239_host_cost \
            --report timing-evidence/stage239-cost-py${{ matrix.python }}.json
          python3 -m json.tool \
            timing-evidence/stage239-cost-py${{ matrix.python }}.json \
            >/dev/null
          python3 -m tools.foj_stage239_cost_check \
            timing-evidence/stage239-cost-py${{ matrix.python }}.json
      - name: Stage239 forecast cost harness (UBSan correctness)
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -D_POSIX_C_SOURCE=200809L -Icore \
            tests/test_battle_threat_cost.c core/tactical_battle.c \
            core/tactical_demo.c -o /tmp/foj239_host_cost_ubsan
          /tmp/foj239_host_cost_ubsan --report /tmp/foj239_ubsan_report.json
      - name: Archive Stage239 measured CI host costs
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage239-host-threat-cost-py${{ matrix.python }}
          path: timing-evidence/
          if-no-files-found: error

      - name: Stage240 render microsecond telemetry (strict C11)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_render_cost_meter.c core/render_cost_meter.c \
            -o /tmp/foj240_render_cost_meter
          /tmp/foj240_render_cost_meter
      - name: Stage240 render time diagnostics (UBSan)
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_render_cost_meter.c core/render_cost_meter.c \
            -o /tmp/foj240_render_cost_ubsan
          /tmp/foj240_render_cost_ubsan

      - name: Compile portable FoJ COLL parser under strict C11 flags
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_coll_grid.c core/coll_grid.c -lm -o /tmp/foj_coll_tests
          /tmp/foj_coll_tests
      - name: Validate Stage218 generated-only COLL diagnostic window
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_coll_battle_window.c core/coll_battle_window.c \
            core/tactical_demo.c -lm -o /tmp/foj_coll_battle_window
          /tmp/foj_coll_battle_window
      - name: Check Stage218 window bounds with UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_coll_battle_window.c core/coll_battle_window.c \
            core/tactical_demo.c -lm -o /tmp/foj_coll_window_ubsan
          /tmp/foj_coll_window_ubsan

      - name: Stage221 host COLL panel and shared private-loader tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore -Iswitch/source \
            tests/test_coll_battle_overlay.c core/coll_battle_overlay.c \
            core/coll_battle_window.c switch/source/local_coll_window.c \
            core/coll_grid.c core/tactical_demo.c -lm \
            -o /tmp/foj_stage221_panel
          /tmp/foj_stage221_panel
      - name: Stage221 diagnostic bounds and local loader UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined -fno-omit-frame-pointer \
            -Icore -Iswitch/source \
            tests/test_coll_battle_overlay.c core/coll_battle_overlay.c \
            core/coll_battle_window.c switch/source/local_coll_window.c \
            core/coll_grid.c core/tactical_demo.c -lm \
            -o /tmp/foj_stage221_panel_ubsan
          /tmp/foj_stage221_panel_ubsan

      - name: Check COLL parser with address and undefined-behavior sanitizers
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_coll_grid.c core/coll_grid.c -lm -o /tmp/foj_coll_sanitized
          /tmp/foj_coll_sanitized

      - name: Validate six raw COLL columns as a separate isometric diagnostic plot
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_coll_iso_view.c core/coll_iso_view.c \
            -lm -o /tmp/foj_coll_iso
          /tmp/foj_coll_iso

      - name: Check COLL isometric projection with UBSan
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined \
            -fno-omit-frame-pointer -Icore \
            tests/test_coll_iso_view.c core/coll_iso_view.c \
            -lm -o /tmp/foj_coll_iso_ubsan
          /tmp/foj_coll_iso_ubsan

      - name: Compile user-local COLL validator CLI
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tools/coll_validate_local.c core/coll_grid.c -lm -o /tmp/foj_coll_validate
          /tmp/foj_coll_validate --help

      - name: Validate 50x50 COLL heatmap and raw flag channels
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_coll_view.c core/coll_view.c -lm -o /tmp/foj_coll_view_test
          /tmp/foj_coll_view_test

      - name: Compile and run isometric rendering tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_isometric_demo.c core/isometric_demo.c core/tactical_demo.c core/tactical_battle.c \
            -o /tmp/foj_iso_tests
          /tmp/foj_iso_tests

# No game packages, console keys, third-party assets, or decryption used in CI.
