name: Stage255 NeXium tight-budget research-only fallback

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage255-nexium-budget-fallback.yml'
      - 'core/compact_budget_probe.*'
      - 'core/base_cache_compact.*'
      - 'tests/test_stage255_*'
      - 'tests/emulator/test_stage255_*'
      - 'tools/foj_stage255_*'
      - 'switch/Makefile'
      - 'switch/source/iso_main.c'
      - 'core/isometric_demo.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage255-nexium-budget-fallback.yml'
      - 'core/compact_budget_probe.*'
      - 'core/base_cache_compact.*'
      - 'tests/test_stage255_*'
      - 'tests/emulator/test_stage255_*'
      - 'tools/foj_stage255_*'
      - 'switch/Makefile'
      - 'switch/source/iso_main.c'

permissions:
  contents: read

jobs:
  native:
    name: Stage255 guest proof native GCC Clang UBSan ASan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict host tests and verify byte-perfect guest receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flags="-std=c11 -Wall -Wextra -Werror -pedantic -O2 -Icore -DFOJ_STAGE252_STRESS=1 -DFOJ_STAGE254_REUSE=1 -DFOJ_STAGE255_BUDGET_FALLBACK=1"
          shared="core/base_cache_compact.c core/isometric_demo.c core/tactical_battle.c core/tactical_demo.c"
          for case in budget_fallback budget_guest_probe; do
            if [ "$case" = budget_fallback ]; then
              src="tests/test_stage255_budget_fallback.c $shared"
            else
              src="tests/test_stage255_budget_guest_probe.c core/compact_budget_probe.c $shared"
            fi
            gcc $flags $src -o "build/stage255-$case-gcc" -lm
            clang $flags $src -o "build/stage255-$case-clang" -lm
            gcc $flags -fsanitize=undefined -fno-sanitize-recover=all $src -o "build/stage255-$case-ubsan" -lm
            clang $flags -fsanitize=address,undefined -fno-omit-frame-pointer $src -o "build/stage255-$case-asan" -lm
            "./build/stage255-$case-gcc"
            "./build/stage255-$case-clang"
            UBSAN_OPTIONS=halt_on_error=1 "./build/stage255-$case-ubsan"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 "./build/stage255-$case-asan"
          done

  build:
    name: devkitA64 Stage255 isolated fallback NRO
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate NRO header
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-isometric-compact-budget-fallback.nro
          python3 tools/validate_nro.py build/foj-isometric-compact-budget-fallback.nro
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage255-budget-fallback-nro
          path: build/foj-isometric-compact-budget-fallback.nro
          if-no-files-found: error

  nexium:
    name: "Nine real NeXium states: Stage255 exact-budget fallback and Stage254 ancestry"
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage255-budget-fallback-nro
          path: nros
      - name: Install NeXium Vulkan and screenshot requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Resolve pinned-by-hash nightly NeXium archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium guest-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > guest-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Decoder mutation tests and inherited stages 238-251
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage255_budget_guest_check.py' -v
      - name: Capture nine genuine NeXium battle states
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-compact-budget-fallback.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/guest-evidence"
          sha256sum "$FOJ_NRO" > guest-evidence/nro.sha256
          test -s "$FOJ_NRO"
          timeout --kill-after=5s 260s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage245_nexium_drive.sh
      - name: Verify 384-frame bounded reuse and inherited Stage253 optical proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage255_budget_guest_check \
            --initial guest-evidence/cache-initial.png \
            --selected guest-evidence/cache-selected.png \
            --hovered guest-evidence/cache-hovered.png \
            --hidden guest-evidence/cache-hidden.png \
            --restored guest-evidence/cache-restored.png \
            --cancelled guest-evidence/cache-cancelled.png \
            --guarded guest-evidence/cache-guarded.png \
            --guard-hovered guest-evidence/cache-guard-hovered.png \
            --ended guest-evidence/cache-ended.png \
            --report guest-evidence/stage255-budget-fallback.json
      - name: Preserve NeXium raster evidence, binary hashes and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage255-NeXium-budget-fallback
          path: guest-evidence/
          if-no-files-found: warn
