name: Stage310 eight BC1 row-patterned page-gutter blends on real NeXium GPU

on:
  pull_request:
    paths:
      - '.github/workflows/stage310-row-gutter-real-nexium.yml'
      - 'gpu/stage310_page_edge_gutter.c'
      - 'gpu/stage310_page_edge_gutter.h'
      - 'gpu/stage310_row_gutter_gpu.mk'
      - 'gpu/stage309_seam_gutter_scene.c'
      - 'gpu/deko3d_clear_main.c'
      - 'tests/gpu/test_stage310_page_edge_gutter.c'
      - 'tests/gpu/test_stage310_row_gutter_scene.c'
      - 'tools/foj_stage310_row_gutter_guest.py'
      - 'tools/foj_stage310_nexium_drive.sh'
      - 'tests/emulator/test_stage310_row_gutter_guest.py'
      - 'docs/GPU_STAGE310_ROW_GUTTER_RECONSTRUCTION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage310-rows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Actual native BC1 eight-band pages and 256-row gutter / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Native eight-band synthetic BC1 page decoder and generic per-row seam builder
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Werror \
            -DFOJ_GPU_THREE_LAYER_BLEND=1 -Igpu -Icore \
            gpu/atlas_dds.c gpu/bc1_atlas_page.c gpu/stage303_bc1_page_uv.c \
            gpu/stage308_cross_page_bilinear.c gpu/stage310_page_edge_gutter.c \
            tests/gpu/test_stage310_page_edge_gutter.c -lm \
            -o /tmp/foj-stage310-general-page-gutter
          /tmp/foj-stage310-general-page-gutter
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Werror \
            -DFOJ_GPU_THREE_LAYER_BLEND=1 \
            -DFOJ_GPU_STAGE310_ROW_PATTERNED_GUTTER=1 -Igpu -Icore \
            gpu/atlas_dds.c gpu/bc1_atlas_page.c gpu/stage303_bc1_page_uv.c \
            gpu/stage308_cross_page_bilinear.c gpu/stage310_page_edge_gutter.c \
            gpu/stage309_seam_gutter_scene.c \
            tests/gpu/test_stage310_row_gutter_scene.c -lm \
            -o /tmp/foj-stage310-real-native-gpu-scene
          /tmp/foj-stage310-real-native-gpu-scene
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject false eight-row GPU bands, stale guests and owner assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage310_row_gutter_guest.py' -v
          bash -n tools/foj_stage310_nexium_drive.sh
          echo STAGE310_NATIVE_EIGHT_BC1_PAIRS_AND_NEGATIVE_EVIDENCE_PASS

  build:
    name: Build actual devkitA64 18-vertex, 8 BC1 row-band GPU NRO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Cross compile opt-in NRO and native shaders
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/stage310_row_gutter_gpu.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-stage310-row-gutter.nro
          echo STAGE310_DEVKITA64_GENERATED_256_ROW_GPU_NRO_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage310-nro-and-shaders
          path: |
            build/foj-deko3d-stage310-row-gutter.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Real GPU displays all eight BC1 page pairs and eight seam midpoint colors
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage310-nro-and-shaders
          path: native
      - name: Install NeXium Vulkan, Pillow and Xvfb runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Pin genuine downloaded NeXium nightly by SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Stage293 exact public invented-material attestation before guest
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          work="$RUNNER_TEMP/stage310-invented-input"
          evidence="$GITHUB_WORKSPACE/runtime-evidence/bridge"
          python3 -m tools.foj_stage293_converted_dds_guest prepare \
            --work-root "$work" --shaders native/gpu/build --evidence "$evidence"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$work" --evidence "$evidence" --phase before
          echo "NEXIUM_DATA_ROOT=$work/staged" >> "$GITHUB_ENV"
          echo "FOJ_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
      - name: Capture two authentic NeXium GPU frames proving all 8 page-edge mixtures
        shell: bash
        run: |
          set -euo pipefail
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-stage310-row-gutter.nro"
          marker="$NEXIUM_DATA_ROOT/sdmc/switch/foj/gpu/foj-native-stage310-row-gutter-pass.txt"
          test ! -e "$marker" && test ! -L "$marker"
          timeout --kill-after=5s 270s xvfb-run -a \
            -s "-screen 0 1280x720x24" bash tools/foj_stage310_nexium_drive.sh
          test -f "$marker" && test ! -L "$marker"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$(dirname "$NEXIUM_DATA_ROOT")" \
            --evidence "$FOJ_EVIDENCE_DIR" --phase after
      - name: Reject missing or fake GPU row colors and copy only validated synthetic evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage310_row_gutter_guest audit \
            --evidence runtime-evidence/bridge
          python3 -m tools.foj_stage310_row_gutter_guest publish \
            --source runtime-evidence --output runtime-evidence-public
          echo STAGE310_ACTUAL_NEIXUM_EIGHT_BANDS_TWO_GPU_FRAMES_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foj-stage310-generated-row-gutter-gpu-evidence
          path: runtime-evidence-public/
          if-no-files-found: error
