name: Stage326 partition spatial coverage oracle

on:
  pull_request:
    paths:
      - '.github/workflows/stage326-partition-spatial-coverage.yml'
      - 'gpu/stage324_corner_tile_clip.c'
      - 'gpu/stage324_corner_tile_clip.h'
      - 'gpu/stage325_corner_tile_partition.c'
      - 'gpu/stage325_corner_tile_partition.h'
      - 'tests/gpu/test_stage326_partition_spatial_coverage.c'
      - 'docs/GPU_STAGE326_PARTITION_SPATIAL_COVERAGE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage326-partition-spatial-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Spatial coverage / ${{ matrix.compiler }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, variant: optimized, flags: '-O2'}
          - {compiler: clang, variant: optimized, flags: '-O2'}
          - {compiler: gcc, variant: ubsan, flags: '-O1 -g -fsanitize=undefined -fno-sanitize-recover=all'}
          - {compiler: clang, variant: asan-ubsan, flags: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'}
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Independently sample partition coverage and overlap
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 ${{ matrix.flags }} \
            -Wall -Wextra -Werror -pedantic -Igpu \
            gpu/stage324_corner_tile_clip.c \
            gpu/stage325_corner_tile_partition.c \
            tests/gpu/test_stage326_partition_spatial_coverage.c \
            -lm -o /tmp/foj-stage326-spatial-coverage
          /tmp/foj-stage326-spatial-coverage
          echo STAGE326_PARTITION_SPATIAL_COVERAGE_PASS
