name: Stage270 guarded native three-layer GPU proof in NeXium

on:
  pull_request:
    paths:
      - '.github/workflows/stage270-native-alpha-guard.yml'
      - 'gpu/three_layer_preflight.c'
      - 'gpu/three_layer_preflight.h'
      - 'tests/test_gpu_three_layer_preflight.c'
      - 'tests/emulator/test_stage270_native_guard_parity.py'
      - 'tools/foj_stage269_guarded_scene.py'
      - 'tools/foj_stage267_*'
      - 'tools/foj_stage266_transparency_order.py'
      - 'tests/emulator/test_stage267_gpu_three_layer.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/native_alpha_guard.mk'
      - 'gpu/private_bundle_intake.*'
      - 'gpu/research_texture.h'
      - 'gpu/Makefile'
      - 'tests/emulator/test_stage269_guarded_scene.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage270-native-alpha-guard.yml'
      - 'tools/foj_stage267_*'
      - 'tools/foj_stage269_guarded_scene.py'
      - 'tests/test_gpu_three_layer_preflight.c'
      - 'gpu/three_layer_preflight.c'
      - 'gpu/three_layer_preflight.h'
      - 'tests/emulator/test_stage267_gpu_three_layer.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/native_alpha_guard.mk'
      - 'gpu/Makefile'
      - 'gpu/private_bundle_intake.*'
      - 'gpu/research_texture.h'
      - 'tools/foj_stage266_transparency_order.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Native C guard rejects bad geometry (GCC and Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute C11 preflight with GCC/Clang and NDEBUG
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            for mode in debug release; do
              flags="-std=c11 -O2 -Wall -Wextra -Werror -pedantic -Icore -Igpu"
              if [[ "$mode" == release ]]; then flags="$flags -DNDEBUG"; fi
              "$compiler" $flags tests/test_gpu_three_layer_preflight.c \
                gpu/three_layer_preflight.c -lm -o "/tmp/foj-stage270-$compiler-$mode"
              "/tmp/foj-stage270-$compiler-$mode"
            done
          done
      - name: Retain host-side rejection and synthetic fixture tests
        run: |
          python3 -m unittest discover -s tests/emulator -p 'test_stage270_native_guard_parity.py' -v
          python3 -m unittest discover -s tests/emulator -p 'test_stage269_guarded_scene.py' -v
          python3 -m unittest discover -s tests/emulator -p 'test_stage268_transparency_crossing.py' -v

  build:
    name: Build actual guarded opt-in NRO with devkitA64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated Stage270 C11 guarded deko3d NRO with UAM shaders
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/native_alpha_guard.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-native-alpha-guard-proof.nro
          python3 -m tools.validate_dksh --expect-stage vertex gpu/build/foj_actor.vert.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_triangle.frag.dksh
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage270-native-guard-program
          path: |
            build/foj-deko3d-native-alpha-guard-proof.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Verify preflight-approved three-layer NRO in real NeXium
    needs: [build, host]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage270-native-guard-program
          path: native
      - name: Install headless display Vulkan and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Run synthetic-only generator and anti-fake screenshot unit checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage260_generated_gpu_visual.py' -v
      - name: Fetch NeXium nightly executable and record provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run generated source-over alpha acceptance and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage267_gpu_three_layer.py' -v
          bash -n tools/foj_stage267_nexium_three_layer_drive.sh
      - name: Run three true NeXium guests on native preflight-approved scene
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-native-alpha-guard-proof.nro"
          for scene in both-half no-middle no-near; do
            root="$RUNNER_TEMP/stage270-generated-$scene"
            mkdir -p "runtime-evidence/$scene"
            python3 -m tools.foj_stage269_guarded_scene \
              --data-root "$root" --shaders native/gpu/build \
              --scenario "$scene" \
              > "runtime-evidence/$scene/generated-input.json"
            export NEXIUM_DATA_ROOT="$root"
            export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence/$scene"
            export FOJ_TRIPLE_CASE="$scene"
            timeout --kill-after=5s 240s xvfb-run -a \
              -s "-screen 0 1280x720x24" \
              bash tools/foj_stage267_nexium_three_layer_drive.sh
          done
      - name: Require independently computed three-layer RGB against six real frames
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage267_gpu_three_layer_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage270-guarded-guest-receipt.json
      - name: Preserve synthetic-only guest captures and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage270-native-guard-guest-evidence
          path: runtime-evidence/
          if-no-files-found: warn
