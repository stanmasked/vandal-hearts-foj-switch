name: Stage325 corner-tile complementary partition

on:
  pull_request:
    paths:
      - '.github/workflows/stage325-corner-tile-partition.yml'
      - 'gpu/stage325_corner_tile_partition.c'
      - 'gpu/stage325_corner_tile_partition.h'
      - 'tests/gpu/test_stage325_corner_tile_partition.c'
      - 'docs/GPU_STAGE325_CORNER_TILE_PARTITION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage325-corner-tile-partition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Complementary partition / ${{ matrix.compiler }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, variant: optimized, flags: '-O2'}
          - {compiler: clang, variant: optimized, flags: '-O2'}
          - {compiler: gcc, variant: ubsan, flags: '-O1 -g -fsanitize=undefined -fno-sanitize-recover=all'}
          - {compiler: clang, variant: asan-ubsan, flags: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'}
    steps:
      - uses: actions/checkout@v4
      - name: Verify disjoint tile/remainder geometry and area conservation
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 ${{ matrix.flags }} \
            -Wall -Wextra -Werror -pedantic -Igpu \
            gpu/stage325_corner_tile_partition.c \
            tests/gpu/test_stage325_corner_tile_partition.c \
            -lm -o /tmp/foj-stage325-partition
          /tmp/foj-stage325-partition
          echo STAGE325_CORNER_TILE_COMPLEMENTARY_PARTITION_PASS
