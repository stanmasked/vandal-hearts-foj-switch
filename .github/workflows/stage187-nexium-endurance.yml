name: Stage 187 NeXium COLL 48-toggle endurance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage187-nexium-endurance.yml'
      - 'tools/foj_stage187_nexium_endurance_check.py'
      - 'tools/foj_stage187_nexium_drive.sh'
      - 'tests/emulator/test_stage187_nexium_endurance_check.py'
      - 'tools/foj_stage183_coll_mode_reference.c'
      - 'tools/foj_stage183_coll_y_frame_check.py'
      - 'switch/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage187-nexium-endurance.yml'
      - 'tools/foj_stage187_nexium_endurance_check.py'
      - 'tools/foj_stage187_nexium_drive.sh'
      - 'tests/emulator/test_stage187_nexium_endurance_check.py'
      - 'tools/foj_stage183_coll_mode_reference.c'
      - 'tools/foj_stage183_coll_y_frame_check.py'
      - 'switch/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  build:
    name: Build generated-only COLL research NRO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate actual COLL NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-coll-map-research.nro
          python3 tools/validate_nro.py build/foj-coll-map-research.nro
      - name: Upload built research homebrew only
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage187-generated-coll-nro
          path: build/foj-coll-map-research.nro
          if-no-files-found: error

  nexium:
    name: Verify 48 real guest button events, pixels and host memory
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage187-generated-coll-nro
          path: nros
      - name: Install Xvfb software Vulkan and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Obtain NeXium nightly and archive digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium runtime-evidence
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
          sha256sum /tmp/nexium-linux.tar.gz \
            > runtime-evidence/nexium-nightly-archive.sha256
      - name: Generate two synthetic reference frames with portable C renderers
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tools/foj_stage183_coll_mode_reference.c \
            core/coll_view.c core/coll_iso_view.c -lm \
            -o /tmp/foj-stage187-coll-reference
          /tmp/foj-stage187-coll-reference heatmap runtime-evidence/ref-coll-heat.ppm
          /tmp/foj-stage187-coll-reference isometric runtime-evidence/ref-coll-iso.ppm
          python3 tools/ppm_to_png.py runtime-evidence/ref-coll-heat.ppm \
            runtime-evidence/ref-coll-heat.png
          python3 tools/ppm_to_png.py runtime-evidence/ref-coll-iso.ppm \
            runtime-evidence/ref-coll-iso.png
          rm runtime-evidence/ref-coll-heat.ppm runtime-evidence/ref-coll-iso.ppm
      - name: Regression-test fail-closed endurance screenshot classifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage187_nexium_endurance_check.py' -v
      - name: Launch NeXium and send 48 distinct Nintendo Switch Y inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s nros/foj-coll-map-research.nro
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-coll-map-research.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence"
          timeout --kill-after=5s 230s xvfb-run -a -s "-screen 0 1280x720x24" \
            bash tools/foj_stage187_nexium_drive.sh
      - name: Verify guest framebuffer stability and host memory evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage187_nexium_endurance_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage187-nexium-endurance-receipt.json
      - name: Preserve evidence even when guest runtime fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage187-nexium-endurance-evidence
          path: runtime-evidence/
          if-no-files-found: warn
