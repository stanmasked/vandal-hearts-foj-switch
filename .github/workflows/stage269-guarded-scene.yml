name: Stage269 generated three-layer preflight gate
on:
  pull_request:
    paths:
      - '.github/workflows/stage269-guarded-scene.yml'
      - 'tools/foj_stage269_guarded_scene.py'
      - 'tests/emulator/test_stage269_guarded_scene.py'
      - 'tools/foj_stage268_transparency_crossing.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    name: Fail closed before rendering unsafe synthetic scenes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate and reject unsafe overlap inputs
        run: |
          python3 -m unittest discover -s tests/emulator -p 'test_stage269_guarded_scene.py' -v
          python3 -m unittest discover -s tests/emulator -p 'test_stage268_transparency_crossing.py' -v
          python3 -m compileall -q tools/foj_stage269_guarded_scene.py
