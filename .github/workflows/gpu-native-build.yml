name: Native Switch GPU NRO and DKSH build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpu-native-build.yml"
      - "gpu/**"
      - "tools/foj_gpu_local_dds_preflight.py"
      - "tests/test_foj_gpu_local_dds_preflight.py"
      - "tests/foj_native_dds_contract_probe.c"
      - "core/gpu_vertex_stream.h"
      - "core/gpu_vertex_stream.c"
      - "core/gpu_draw_plan.c"
      - "core/gpu_draw_plan.h"
      - "core/textured_triangles.h"
      - "tools/validate_nro.py"
      - "tools/validate_dksh.py"
      - "tools/foj_stage165_sd_bundle.py"
      - "tools/foj_stage166_hardware_observations.py"
      - "tools/foj_stage162_synthetic_dds.py"
  pull_request:
    paths:
      - ".github/workflows/gpu-native-build.yml"
      - "gpu/**"
      - "tools/foj_gpu_local_dds_preflight.py"
      - "tests/test_foj_gpu_local_dds_preflight.py"
      - "tests/foj_native_dds_contract_probe.c"
      - "core/gpu_vertex_stream.h"
      - "core/gpu_vertex_stream.c"
      - "core/gpu_draw_plan.c"
      - "core/gpu_draw_plan.h"
      - "core/textured_triangles.h"
      - "tools/validate_nro.py"
      - "tools/validate_dksh.py"
      - "tools/foj_stage165_sd_bundle.py"
      - "tools/foj_stage166_hardware_observations.py"
      - "tools/foj_stage162_synthetic_dds.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gpu:
    name: devkitA64 deko3d NRO / UAM DKSH
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:20260219
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Show installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          "${DEVKITPRO}/devkitA64/bin/aarch64-none-elf-gcc" --version
          test -f "${DEVKITPRO}/libnx/include/deko3d.h"
          test -f "${DEVKITPRO}/libnx/lib/libdeko3dd.a"
          test -x "${DEVKITPRO}/tools/bin/elf2nro"
          test -x "${DEVKITPRO}/tools/bin/nacptool"
          command -v uam
      - name: Build and validate shader-free GPU clear NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/clear.mk verify
      - name: Build and validate shader-backed research triangle NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/triangle.mk verify
      - name: Compile and validate generated-only UAM DKSH modules
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/Makefile triangle-verify
          make -f gpu/Makefile verify
      - name: Create fixed generated-only manual SD smoke ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage165_sd_bundle --repo-root . --output build/foj-stage165-gpu-sd-smoke.zip
          python3 -m zipfile -t build/foj-stage165-gpu-sd-smoke.zip
      - name: Publish an EMPTY hardware observation sheet (no fake observations)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage166_hardware_observations --init build/foj-stage166-blank-observations.json
          python3 -m tools.foj_stage166_hardware_observations --audit build/foj-stage166-blank-observations.json > build/foj-stage166-empty-audit.json
          python3 -c 'import json; r=json.load(open("build/foj-stage166-empty-audit.json")); assert r["declared_screen_stages"] == 0 and r["hardware_execution_verified"] is False'
      - name: Upload SDK-built research binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foj-gpu-native-research
          path: |
            build/foj-deko3d-clear-smoke.nro
            build/foj-deko3d-triangle-research.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_actor.frag.dksh
            gpu/build/foj_triangle.frag.dksh
            build/foj-stage165-gpu-sd-smoke.zip
            build/foj-stage166-blank-observations.json
          if-no-files-found: error
          retention-days: 7
