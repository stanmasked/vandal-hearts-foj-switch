name: Stage296 private RGBA pixel-layout witness (synthetic CI)

on:
  pull_request:
    paths:
      - '.github/workflows/stage296-private-rgba-layout-witness.yml'
      - 'tools/foj_stage296_private_rgba_layout_witness.py'
      - 'tests/emulator/test_stage296_private_rgba_layout_witness.py'
      - 'tools/foj_stage295_owner_local_source_integrity.py'
      - 'tools/foj_stage294_owner_local_gtf_envelope.py'
      - 'tools/foj_stage292_synthetic_gtf_dds_roundtrip.py'
      - 'tools/foj_fd_bound_reader.py'
      - 'docs/GPU_STAGE296_PRIVATE_RGBA_LAYOUT_WITNESS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage296-private-rgba-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-witness:
    name: Synthetic mip layout and independent private RGBA digest / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test independent witness comparison without disclosing private bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/foj_stage296_private_rgba_layout_witness.py
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage296_private_rgba_layout_witness.py' -v
          echo STAGE296_SYNTHETIC_PRIVATE_RGBA_REFERENCE_PASS
      # No actual PS3 assets, local digest files or generated decoded pixel artifacts.
