name: Stage293 Stage292-converted three DDS NeXium GPU proof

on:
  pull_request:
    paths:
      - '.github/workflows/stage293-converted-dds-nexium.yml'
      - 'tools/foj_stage293_converted_dds_guest.py'
      - 'tests/emulator/test_stage293_converted_dds_guest.py'
      - 'tools/foj_stage292_synthetic_gtf_dds_roundtrip.py'
      - 'tools/foj_stage286_private_three_dds_material_bridge.py'
      - 'tools/foj_stage274_nexium_pass_drive.sh'
      - 'tools/foj_stage273_nexium_dynamic_gpu_drive.sh'
      - 'tools/foj_stage289_public_guest_evidence.py'
      - 'gpu/atlas_dds.c'
      - 'docs/GPU_STAGE293_CONVERTED_DDS_NEIXUM_GPU.md'
  workflow_dispatch:

concurrency:
  group: stage293-converted-dds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Generated-only conversion and leak regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Refuse conversion bypass and evidence leaks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/foj_stage292_synthetic_gtf_dds_roundtrip.py \
            tools/foj_stage293_converted_dds_guest.py
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage293_converted_dds_guest.py' -v
          echo STAGE293_SYNTHETIC_CONVERSION_AND_EVIDENCE_HOST_PASS

  build:
    name: Rebuild existing Stage275 native deko3d NRO on devkitA64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build existing native GPU program and UAM shaders
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/topology_reject_contract.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-topology-reject-proof.nro
          python3 -m tools.validate_dksh --expect-stage vertex gpu/build/foj_actor.vert.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_triangle.frag.dksh
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage293-converted-dds-nro-shaders
          path: |
            build/foj-deko3d-topology-reject-proof.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Real NeXium GPU reads Stage292-converted synthetic materials
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage293-converted-dds-nro-shaders
          path: native
      - name: Install software Vulkan and headless capture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Fetch NeXium nightly and record archive identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Recheck generated-only host regressions and guest driver syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage293_converted_dds_guest.py' -v
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage273_dynamic_gpu.py' -v
          bash -n tools/foj_stage273_nexium_dynamic_gpu_drive.sh
          bash -n tools/foj_stage274_nexium_pass_drive.sh
      - name: Stage292 converter to Stage286 bridge to real NeXium GPU
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-topology-reject-proof.nro"
          work="$RUNNER_TEMP/stage293-converted-generated-private-fixture"
          evidence="$GITHUB_WORKSPACE/runtime-evidence/bridge"
          python3 -m tools.foj_stage293_converted_dds_guest prepare \
            --work-root "$work" --shaders native/gpu/build --evidence "$evidence"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$work" --evidence "$evidence" --phase before
          export NEXIUM_DATA_ROOT="$work/staged"
          export FOJ_EVIDENCE_DIR="$evidence"
          export FOJ_DYNAMIC_CASE=original
          timeout --kill-after=5s 240s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage274_nexium_pass_drive.sh
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$work" --evidence "$evidence" --phase after
      - name: Independent evidence audit on real NeXium framebuffer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage293_converted_dds_guest audit \
            --evidence runtime-evidence/bridge \
            --report runtime-evidence/bridge/stage293-three-converted-dds-gpu-receipt.json
          echo STAGE293_CONVERTED_SYNTHETIC_THREE_DDS_NEIXUM_GPU_PASS
      - name: Fail-closed public evidence publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage293_converted_dds_guest publish \
            --source runtime-evidence \
            --output runtime-evidence-public
          echo STAGE293_NINE_FILE_PUBLIC_GPU_EVIDENCE_PASS
      - name: Upload only audited generated-only guest evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage293-converted-three-dds-real-guest-evidence
          path: runtime-evidence-public/
          if-no-files-found: error
          # Never upload raw runtime-evidence/, generated source GTF or private Stage286 manifest.
