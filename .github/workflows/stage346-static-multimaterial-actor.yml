name: Stage346 static multi-material GPU actor

on:
  pull_request:
    paths:
      - '.github/workflows/stage346-static-multimaterial-actor.yml'
      - 'core/rigmesh_io.*'
      - 'tools/export_local_rigmesh.py'
      - 'tests/test_rigmesh_io.c'
      - 'tests/test_export_local_rigmesh.py'
      - 'tools/foj_stage346_generated_static_gpu_sd.py'
      - 'tests/emulator/test_stage346_generated_static_gpu_sd.py'
      - 'gpu/private_draw.mk'
      - 'gpu/private_bundle_intake.*'
      - 'gpu/private_actor_bridge.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Static FOJRM exporter and bundle tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python exporter and generated fixture tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_export_local_rigmesh.py' -v
          python3 -m unittest discover -s tests/emulator -p 'test_stage346_generated_static_gpu_sd.py' -v
      - name: GCC static and rigged FOJRM parser tests
        run: |
          set -euo pipefail
          mkdir -p build
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -Icore \
            tests/test_rigmesh_io.c core/rigmesh_io.c core/skeletal_skin.c \
            -lm -o build/stage346-rigmesh-gcc
          build/stage346-rigmesh-gcc
      - name: GCC and Clang bundle intake strict, NDEBUG and sanitizer checks
        run: |
          set -euo pipefail
          sources="tests/test_gpu_private_bundle_intake.c gpu/private_bundle_intake.c gpu/private_actor_bridge.c gpu/actor_upload_plan.c gpu/atlas_dds.c core/rigmesh_io.c core/material_table.c core/gpu_vertex_stream.c core/gpu_draw_plan.c"
          for cc in gcc clang; do
            for mode in strict ndebug sanitized; do
              flags="-std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -Icore -Igpu"
              case "$mode" in
                strict) ;;
                ndebug) flags="$flags -DNDEBUG" ;;
                sanitized) flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer" ;;
              esac
              "$cc" $flags $sources -lm -o "build/stage346-$cc-$mode"
              ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "./build/stage346-$cc-$mode"
            done
          done

  build:
    name: Build private-actor NRO and generated UAM shaders
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO and validate shaders
        run: |
          set -euo pipefail
          make -f gpu/private_draw.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-private-actor-upload.nro
          python3 -m tools.validate_dksh --expect-stage vertex gpu/build/foj_actor.vert.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_triangle.frag.dksh
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage346-static-multimaterial-gpu-program
          path: |
            build/foj-deko3d-private-actor-upload.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error
          retention-days: 7

  nexium:
    name: Generated-only static mesh with two GPU material batches
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage346-static-multimaterial-gpu-program
          path: native
      - name: Install headless display and Vulkan tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Test generated-only static bundle
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage346_generated_static_gpu_sd.py' -v
      - name: Fetch NeXium and verify release asset SHA-256
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_record="$(printf '%s' "$release" | jq -cer \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | {url:.browser_download_url,digest:.digest}')"
          asset="$(printf '%s' "$asset_record" | jq -er '.url | strings | select(startswith("https://"))')"
          expected_digest="$(printf '%s' "$asset_record" | jq -er \
            '.digest | strings | select(test("^sha256:[0-9a-f]{64}$")) | sub("^sha256:";"")')"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$asset" -o /tmp/nexium-linux-x86_64.tar.gz
          actual_digest="$(sha256sum /tmp/nexium-linux-x86_64.tar.gz | awk '{print $1}')"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "NeXium release asset SHA-256 differs from release metadata" >&2
            exit 1
          fi
          printf '%s  nexium-linux-x86_64.tar.gz\n' "$actual_digest" \
            > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux-x86_64.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Populate generated static FOJRM, FOJMAT and two DDS files
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/stage346-generated-static-sd"
          python3 -m tools.foj_stage346_generated_static_gpu_sd \
            --data-root "$root" --shaders native/gpu/build \
            > runtime-evidence/generated-input.json
          for name in actor.fojrm actor.fojmat material0.dds material1.dds \
            foj_actor.vert.dksh foj_triangle.frag.dksh; do
            test -s "$root/sdmc/switch/foj/gpu/$name"
          done
          echo "NEXIUM_DATA_ROOT=$root" >> "$GITHUB_ENV"
      - name: Run actual NeXium GPU guest and capture two frames
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-private-actor-upload.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence"
          timeout --kill-after=5s 180s xvfb-run -a \
            -s "-screen 0 1280x720x24" bash tools/foj_stage260_nexium_gpu_drive.sh
      - name: Require both material colors in independent GPU screenshots
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage260_gpu_guest_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage346-static-gpu-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foj-stage346-generated-static-gpu-evidence
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 7
