name: Stage 233 NeXium visual-only threat toggle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage233-nexium-threat-toggle.yml'
      - 'tools/foj_stage233_threat_toggle_guest_check.py'
      - 'tools/foj_stage233_nexium_drive.sh'
      - 'tests/emulator/test_stage233_threat_toggle_guest_check.py'
      - 'switch/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage233-nexium-threat-toggle.yml'
      - 'tools/foj_stage233_threat_toggle_guest_check.py'
      - 'tools/foj_stage233_nexium_drive.sh'
      - 'tests/emulator/test_stage233_threat_toggle_guest_check.py'
      - 'switch/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  build:
    name: Build generated NRO with right-stick threat visibility toggle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate real interactive battle NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-isometric-research.nro
          python3 tools/validate_nro.py build/foj-isometric-research.nro
      - name: Publish generated-only guest executable
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage233-synthetic-threat-toggle-nro
          path: build/foj-isometric-research.nro
          if-no-files-found: error

  nexium:
    name: Verify right-stick visual-only toggle in actual NeXium guest
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage233-synthetic-threat-toggle-nro
          path: nros
      - name: Install headless Vulkan and screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Obtain pinned NeXium nightly and record digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium runtime-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Regress screenshot verifier against ten generated cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage233_threat_toggle_guest_check.py' -v
      - name: Capture selected hero, risk hidden then shown again in NeXium
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-research.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence"
          test -s "$FOJ_NRO"
          timeout --kill-after=5s 230s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage233_nexium_drive.sh
      - name: Require visible-hidden-restored risk with unchanged battle meter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage233_threat_toggle_guest_check \
            --initial runtime-evidence/toggle-initial.png \
            --visible runtime-evidence/toggle-visible.png \
            --hidden runtime-evidence/toggle-hidden.png \
            --restored runtime-evidence/toggle-restored.png \
            --report runtime-evidence/stage233-threat-toggle-receipt.json
      - name: Preserve actual synthetic guest screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage233-nexium-threat-toggle-evidence
          path: runtime-evidence/
          if-no-files-found: warn
