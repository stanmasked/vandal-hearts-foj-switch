name: Stage294 owner-local GTF texture envelope gate (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/stage294-owner-local-gtf-envelope.yml'
      - 'tools/foj_stage294_owner_local_gtf_envelope.py'
      - 'tests/emulator/test_stage294_owner_local_gtf_envelope.py'
      - 'tools/foj_stage291_ps3_texture_header_triage.py'
      - 'tools/foj_stage290_private_texture_compatibility.py'
      - 'tools/foj_stage292_synthetic_gtf_dds_roundtrip.py'
      - 'tools/foj_fd_bound_reader.py'
      - 'docs/GPU_STAGE294_OWNER_LOCAL_GTF_ENVELOPE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage294-gtf-envelope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Source-envelope false-positive and privacy regressions / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run invented-only structural gate tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/foj_stage294_owner_local_gtf_envelope.py
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage294_owner_local_gtf_envelope.py' -v
          echo STAGE294_SYNTHETIC_GTF_ENVELOPE_AND_PRIVACY_PASS
      # Not even a sanitized scan is uploaded: no user files or private runs in CI.
