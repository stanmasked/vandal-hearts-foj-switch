name: Stage269 guarded three-layer alpha GPU native and NeXium proof

on:
  pull_request:
    paths:
      - '.github/workflows/stage269-native-order-preflight.yml'
      - 'tools/foj_stage267_*'
      - 'tools/foj_stage266_transparency_order.py'
      - 'tests/emulator/test_stage267_gpu_three_layer.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/guarded_three_layer.mk'
      - 'gpu/private_bundle_intake.*'
      - 'gpu/research_texture.h'
      - 'gpu/transparent_order_guard.*'
      - 'tests/native/stage269_transparency_guard.c'
      - 'gpu/Makefile'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage269-native-order-preflight.yml'
      - 'tools/foj_stage267_*'
      - 'tests/emulator/test_stage267_gpu_three_layer.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/guarded_three_layer.mk'
      - 'gpu/Makefile'
      - 'gpu/private_bundle_intake.*'
      - 'gpu/research_texture.h'
      - 'gpu/transparent_order_guard.*'
      - 'tests/native/stage269_transparency_guard.c'
      - 'tools/foj_stage266_transparency_order.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host_guard:
    name: C99 guard rejects crossing transparency (GCC and Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run native C99 geometry guard assertions
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            "$compiler" -std=c11 -Wall -Wextra -Werror -pedantic \
              -Igpu -Icore \
              gpu/transparent_order_guard.c \
              tests/native/stage269_transparency_guard.c \
              -lm -o "$RUNNER_TEMP/order-guard-$compiler"
            "$RUNNER_TEMP/order-guard-$compiler"
          done
  build:
    needs: host_guard
    name: Build truly guarded native NRO and generated UAM shader pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated Stage269 guarded three-material deko3d NRO with UAM shaders
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/guarded_three_layer.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-three-layer-guarded-proof.nro
          python3 -m tools.validate_dksh --expect-stage vertex gpu/build/foj_actor.vert.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_triangle.frag.dksh
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage269-guarded-gpu-program
          path: |
            build/foj-deko3d-three-layer-guarded-proof.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Verify guarded NRO preserves real three-layer NeXium pixels
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage269-guarded-gpu-program
          path: native
      - name: Install headless display Vulkan and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Run synthetic-only generator and anti-fake screenshot unit checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage260_generated_gpu_visual.py' -v
      - name: Fetch NeXium nightly executable and record provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run generated source-over alpha acceptance and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage267_gpu_three_layer.py' -v
          bash -n tools/foj_stage267_nexium_three_layer_drive.sh
      - name: Run three NeXium guests with native guard enabled
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-three-layer-guarded-proof.nro"
          for scene in both-half no-middle no-near; do
            root="$RUNNER_TEMP/stage269-guarded-generated-$scene"
            mkdir -p "runtime-evidence/$scene"
            python3 -m tools.foj_stage267_generated_multiblend_sd \
              --data-root "$root" --shaders native/gpu/build \
              --scenario "$scene" \
              > "runtime-evidence/$scene/generated-input.json"
            export NEXIUM_DATA_ROOT="$root"
            export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence/$scene"
            export FOJ_TRIPLE_CASE="$scene"
            timeout --kill-after=5s 240s xvfb-run -a \
              -s "-screen 0 1280x720x24" \
              bash tools/foj_stage267_nexium_three_layer_drive.sh
          done
      - name: Require independently computed three-layer RGB against six real frames
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage267_gpu_three_layer_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage269-guarded-guest-receipt.json
      - name: Preserve generated-only guest captures and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage269-guarded-guest-evidence
          path: runtime-evidence/
          if-no-files-found: warn
