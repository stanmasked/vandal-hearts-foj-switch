name: Stage341 generated-only DDS shader sampling and framebuffer audit

on:
  pull_request:
    paths:
      - '.github/workflows/stage341-private-dds-frame.yml'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/stage332_dds_source.c'
      - 'gpu/stage332_dds_source.h'
      - 'gpu/stage341_private_dds_frame.mk'
      - 'gpu/stage336_native_upload.c'
      - 'gpu/stage336_native_upload.h'
      - 'gpu/stage336_gpu_copy_plan.c'
      - 'gpu/stage336_gpu_copy_plan.h'
      - 'gpu/stage335_source_staging.c'
      - 'gpu/stage335_source_staging.h'
      - 'gpu/atlas_dds.c'
      - 'gpu/atlas_dds.h'
      - 'gpu/shaders/foj_actor.vert'
      - 'gpu/shaders/foj_triangle.frag'
      - 'tools/foj_stage340_fixture.py'
      - 'tools/foj_stage341_frame_gate.py'
      - 'tools/foj_stage341_private_run.py'
      - 'tools/foj_stage341_nexium_drive.sh'
      - 'tests/emulator/test_stage341_private_dds_frame.py'
      - 'tests/mock_switch_sdk/deko3d.h'
      - 'gpu/clear.mk'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage341-private-dds-frame-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host DDS reference, source contract and fail-closed evidence tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generated-fixture test dependency
        run: python3 -m pip install Pillow
      - name: Run Stage340 intake and Stage341 evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator -p 'test_stage340_private_dds_roundtrip.py' -v
          python3 -m unittest discover -s tests/emulator -p 'test_stage341_private_dds_frame.py' -v
          python3 -m compileall -q tools/foj_stage340_fixture.py tools/foj_stage340_private_run.py tools/foj_stage341_frame_gate.py tools/foj_stage341_private_run.py
          bash -n tools/foj_stage341_nexium_drive.sh
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DFOJ_GPU_DRAW_TRIANGLE=1 \
            -DFOJ_GPU_STAGE341_PRIVATE_DDS_DRAW=1 -fsyntax-only \
            -Itests/mock_switch_sdk -Icore -Igpu gpu/deko3d_clear_main.c
          echo STAGE341_HOST_REFERENCE_AND_SOURCE_CONTRACT_PASS

  build:
    name: Build Stage341 native-upload textured-quad NRO and shaders
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO and validate generated DKSH modules
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/stage341_private_dds_frame.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-stage341-private-dds-frame.nro
          python3 tools/validate_dksh.py gpu/build/foj_actor.vert.dksh
          python3 tools/validate_dksh.py gpu/build/foj_triangle.frag.dksh
          echo STAGE341_DEVKITA64_TEXTURED_QUAD_NRO_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage341-private-dds-frame-nro-and-dksh
          path: |
            build/foj-deko3d-stage341-private-dds-frame.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error
          retention-days: 7

  nexium:
    name: Real NeXium framebuffer samples generated DDS against independent CPU reference
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage341-private-dds-frame-nro-and-dksh
          path: native
      - name: Install NeXium Vulkan renderer and capture tools
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout --kill-after=15s 360s sudo apt-get "${apt_options[@]}" update
          timeout --kill-after=15s 1500s sudo apt-get "${apt_options[@]}" install -y \
            curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Pin the downloaded NeXium archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$asset" -o /tmp/nexium-linux-x86_64.tar.gz
          printf '%s  nexium-linux-x86_64.tar.gz\n' \
            "$(sha256sum /tmp/nexium-linux-x86_64.tar.gz | awk '{print $1}')" \
            > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux-x86_64.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Stage only generated DDS and generated shaders
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage341-sdroot"
          gpu="$work/sdmc/switch/foj/gpu"
          mkdir -p "$gpu"
          cp native/gpu/build/foj_actor.vert.dksh "$gpu/"
          cp native/gpu/build/foj_triangle.frag.dksh "$gpu/"
          python3 -m tools.foj_stage340_fixture create --path "$gpu/source.dds"
          python3 -m tools.foj_stage340_fixture verify --path "$gpu/source.dds" \
            > runtime-evidence/generated-source.json
          echo "NEXIUM_DATA_ROOT=$work" >> "$GITHUB_ENV"
          echo "FOJ_NRO=$GITHUB_WORKSPACE/native/build/foj-deko3d-stage341-private-dds-frame.nro" >> "$GITHUB_ENV"
          echo "FOJ_EVIDENCE_DIR=$GITHUB_WORKSPACE/runtime-evidence" >> "$GITHUB_ENV"
      - name: Capture and audit two independent real NeXium frames
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 480s xvfb-run -a \
            -s "-screen 0 1280x720x24" bash tools/foj_stage341_nexium_drive.sh
          echo STAGE341_GENERATED_DDS_GPU_FRAME_AUDIT_PASS
      - name: Export strict aggregate only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage341_frame_gate publish \
            --sd-root "$NEXIUM_DATA_ROOT/sdmc" \
            --evidence runtime-evidence \
            --output runtime-evidence-public
          test "$(find runtime-evidence-public -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          echo STAGE341_AGGREGATE_ONLY_EXPORT_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foj-stage341-generated-only-frame-aggregate
          path: runtime-evidence-public/
          if-no-files-found: error
          retention-days: 7
