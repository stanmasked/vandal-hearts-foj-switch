name: Stage341 original DDS sampled by fragment shader in NeXium

on:
  pull_request:
    paths:
      - '.github/workflows/stage341-private-dds-frame.yml'
      - 'gpu/stage341_private_dds_frame.mk'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/stage339_private_dds_bridge.c'
      - 'gpu/stage339_private_dds_bridge.h'
      - 'gpu/stage332_dds_source.c'
      - 'gpu/stage332_dds_source.h'
      - 'gpu/stage336_native_upload.c'
      - 'gpu/stage336_native_upload.h'
      - 'gpu/stage336_gpu_copy_plan.c'
      - 'gpu/stage336_gpu_copy_plan.h'
      - 'gpu/stage335_source_staging.c'
      - 'gpu/stage335_source_staging.h'
      - 'tools/foj_stage340_fixture.py'
      - 'tools/foj_stage341_frame_gate.py'
      - 'tools/foj_stage341_nexium_drive.sh'
      - 'tests/emulator/test_stage341_frame_gate.py'
      - 'docs/GPU_STAGE341_PRIVATE_DDS_FRAMEBUFFER.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage341-private-dds-frame-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host CPU oracle and strict evidence-gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run generated-only frame oracle tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          python3 -m unittest discover -s tests/emulator -p 'test_stage341_frame_gate.py' -v
          python3 -m compileall -q tools/foj_stage340_fixture.py tools/foj_stage341_frame_gate.py
          bash -n tools/foj_stage341_nexium_drive.sh
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DFOJ_GPU_DRAW_TRIANGLE=1 \
            -DFOJ_GPU_STAGE338_NATIVE_TEXTURE_DRAW=1 \
            -DFOJ_GPU_STAGE341_PRIVATE_DDS_DRAW=1 \
            -DFOJ_GPU_STAGE309_LINEAR_GUTTER=1 -fsyntax-only \
            -Itests/mock_switch_sdk -Icore -Igpu gpu/deko3d_clear_main.c
          echo STAGE341_HOST_ORACLE_AND_NATIVE_SOURCE_CONTRACT_PASS

  build:
    name: Build Stage341 native DDS shader-frame NRO and DKSH
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate native private-source-agnostic NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/stage341_private_dds_frame.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-stage341-private-dds-frame.nro
          python3 tools/validate_dksh.py gpu/build/foj_actor.vert.dksh
          python3 tools/validate_dksh.py gpu/build/foj_triangle.frag.dksh
          echo STAGE341_DEVKITA64_SHADER_FRAME_NRO_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage341-private-dds-frame-nro-and-dksh
          path: |
            build/foj-deko3d-stage341-private-dds-frame.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error
          retention-days: 7

  nexium:
    name: Real NeXium samples generated DDS through fragment shader and audits framebuffer pixels
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage341-private-dds-frame-nro-and-dksh
          path: native
      - name: Install NeXium Vulkan renderer and screenshot tools
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout --kill-after=15s 360s sudo apt-get "${apt_options[@]}" update
          timeout --kill-after=15s 1500s sudo apt-get "${apt_options[@]}" install -y \
            curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Pin NeXium binary identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium runtime-evidence/bridge
          release="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz | awk '{print $1}' > runtime-evidence/bridge/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Stage exactly one generated-only DDS and two generated DKSH files
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage341-generated-sdroot"
          gpu="$work/sdmc/switch/foj/gpu"
          mkdir -p "$gpu"
          cp -- native/gpu/build/foj_actor.vert.dksh "$gpu/foj_actor.vert.dksh"
          cp -- native/gpu/build/foj_triangle.frag.dksh "$gpu/foj_triangle.frag.dksh"
          python3 -m tools.foj_stage340_fixture create --path "$gpu/source.dds" \
            > runtime-evidence/bridge/generated-input.json
          python3 -m tools.foj_stage340_fixture verify --path "$gpu/source.dds" >/dev/null
          echo "NEXIUM_DATA_ROOT=$work" >> "$GITHUB_ENV"
          echo "FOJ_NRO=$GITHUB_WORKSPACE/native/build/foj-deko3d-stage341-private-dds-frame.nro" >> "$GITHUB_ENV"
          echo "FOJ_EVIDENCE_DIR=$GITHUB_WORKSPACE/runtime-evidence/bridge" >> "$GITHUB_ENV"
      - name: Capture two real shader-sampled framebuffer frames
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 390s xvfb-run -a \
            -s "-screen 0 1280x720x24" bash tools/foj_stage341_nexium_drive.sh
          python3 -m tools.foj_stage341_frame_gate audit \
            --source-dds "$NEXIUM_DATA_ROOT/sdmc/switch/foj/gpu/source.dds" \
            --evidence "$FOJ_EVIDENCE_DIR" \
            --output "$RUNNER_TEMP/stage341-frame-audit.json" \
            --generated-only
          python3 -m tools.foj_stage341_frame_gate publish-public \
            --report "$RUNNER_TEMP/stage341-frame-audit.json" \
            --evidence "$FOJ_EVIDENCE_DIR" \
            --output "$GITHUB_WORKSPACE/runtime-evidence-public"
          echo STAGE341_REAL_NEIXIUM_GENERATED_DDS_FRAMEBUFFER_PASS
      - name: Publish aggregate-only generated fixture evidence
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foj-stage341-generated-frame-audit-aggregate-only
          path: runtime-evidence-public/
          if-no-files-found: error
          retention-days: 7
