name: Stage 250 NeXium base-raster resolution scaling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage250-nexium-base-scale.yml'
      - 'core/base_cache_scale_probe.*'
      - 'core/base_cache_pair_probe.*'
      - 'core/isometric_demo.*'
      - 'core/isometric_base_cache.h'
      - 'switch/source/iso_main.c'
      - 'switch/Makefile'
      - 'tools/foj_stage250_*'
      - 'tests/test_stage250_*'
      - 'tests/emulator/test_stage250_*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage250-nexium-base-scale.yml'
      - 'core/base_cache_scale_probe.*'
      - 'core/base_cache_pair_probe.*'
      - 'switch/source/iso_main.c'
      - 'switch/Makefile'

permissions:
  contents: read

jobs:
  native:
    name: GCC Clang UBSan three-size base-cache parity and memory audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Stage250 all-three-resolution parity, exact size keys and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          common="-std=c11 -Wall -Wextra -Werror -pedantic -O2 -Icore"
          inputs="tests/test_stage250_base_cache_scale.c core/base_cache_scale_probe.c core/base_cache_stability_probe.c core/base_cache_pair_probe.c core/isometric_demo.c core/tactical_battle.c core/tactical_demo.c"
          gcc $common $inputs -o build/stage250-gcc -lm
          clang $common $inputs -o build/stage250-clang -lm
          gcc $common -fsanitize=undefined -fno-sanitize-recover=all $inputs -o build/stage250-ubsan -lm
          ./build/stage250-gcc
          ./build/stage250-clang
          UBSAN_OPTIONS=halt_on_error=1 ./build/stage250-ubsan

  build:
    name: devkitA64 research-only resolution-scaling NRO
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify Switch NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-isometric-base-cache-scale.nro
          python3 tools/validate_nro.py build/foj-isometric-base-cache-scale.nro
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage250-base-cache-scale-nro
          path: build/foj-isometric-base-cache-scale.nro
          if-no-files-found: error

  nexium:
    name: Nine real NeXium states with 3 cold/warm sizes and inherited parity
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage250-base-cache-scale-nro
          path: nros
      - name: Install NeXium Vulkan and screenshot requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Resolve pinned-by-hash nightly NeXium archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium guest-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > guest-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Decoder mutation tests and inherited stages 238-249
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage250_scale_guest_check.py' -v
      - name: Capture nine genuine NeXium battle states
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-base-cache-scale.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/guest-evidence"
          sha256sum "$FOJ_NRO" > guest-evidence/nro.sha256
          test -s "$FOJ_NRO"
          timeout --kill-after=5s 260s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage245_nexium_drive.sh
      - name: Verify cold/warm 320/640/1280 receipts and prior 238-249 proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage250_scale_guest_check \
            --initial guest-evidence/cache-initial.png \
            --selected guest-evidence/cache-selected.png \
            --hovered guest-evidence/cache-hovered.png \
            --hidden guest-evidence/cache-hidden.png \
            --restored guest-evidence/cache-restored.png \
            --cancelled guest-evidence/cache-cancelled.png \
            --guarded guest-evidence/cache-guarded.png \
            --guard-hovered guest-evidence/cache-guard-hovered.png \
            --ended guest-evidence/cache-ended.png \
            --report guest-evidence/stage250-cross-resolution-base-cache-us.json
      - name: Preserve NeXium raster evidence, binary hashes and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage250-NeXium-resolution-scaling
          path: guest-evidence/
          if-no-files-found: warn
