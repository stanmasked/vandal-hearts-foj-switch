name: Stage297 private tile-order RGBA reference gate (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/stage297-private-tile-reference.yml'
      - 'tools/foj_stage297_private_tile_reference_gate.py'
      - 'tests/emulator/test_stage297_private_tile_reference_gate.py'
      - 'tools/foj_stage295_owner_local_source_integrity.py'
      - 'tools/foj_stage296_private_rgba_layout_witness.py'
      - 'tools/foj_stage294_owner_local_gtf_envelope.py'
      - 'tools/foj_fd_bound_reader.py'
      - 'docs/GPU_STAGE297_PRIVATE_TILE_REFERENCE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage297-tile-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-witness:
    name: Invented 4/8 tile raster and Morton mip reference / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run source layout and privacy regressions without game assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/foj_stage297_private_tile_reference_gate.py
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage297_private_tile_reference_gate.py' -v
          echo STAGE297_SYNTHETIC_TILE_MIP_REFERENCE_PASS
      # No owner PS3 bytes, RGBA output, private source digests or artifacts.
