name: Stage345 native BMODEL to rig-mesh bridge

on:
  pull_request:
    paths:
      - '.github/workflows/stage345-bmodel-mesh-bridge.yml'
      - 'gpu/stage345_bmodel_mesh_bridge.c'
      - 'gpu/stage345_bmodel_mesh_bridge.h'
      - 'gpu/stage344_bmodel_rig.c'
      - 'gpu/stage344_bmodel_rig.h'
      - 'gpu/stage343_bmodel_source.c'
      - 'gpu/stage343_bmodel_source.h'
      - 'core/rigmesh_io.c'
      - 'core/rigmesh_io.h'
      - 'core/skeletal_skin.c'
      - 'core/skeletal_skin.h'
      - 'core/banim_core.c'
      - 'core/banim_core.h'
      - 'tests/gpu/test_stage345_bmodel_mesh_bridge.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: GCC and Clang strict C99 bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: GCC bridge and skinning tests
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -pedantic \
            -Igpu -Icore gpu/stage343_bmodel_source.c \
            gpu/stage344_bmodel_rig.c gpu/stage345_bmodel_mesh_bridge.c \
            core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            tests/gpu/test_stage345_bmodel_mesh_bridge.c -lm \
            -o /tmp/stage345-gcc
          /tmp/stage345-gcc
      - name: Clang bridge and skinning tests
        run: |
          set -euo pipefail
          clang -std=c99 -O2 -Wall -Wextra -Werror -pedantic \
            -Igpu -Icore gpu/stage343_bmodel_source.c \
            gpu/stage344_bmodel_rig.c gpu/stage345_bmodel_mesh_bridge.c \
            core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            tests/gpu/test_stage345_bmodel_mesh_bridge.c -lm \
            -o /tmp/stage345-clang
          /tmp/stage345-clang

  sanitizers:
    name: Clang ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run sanitized native bridge tests
        run: |
          set -euo pipefail
          clang -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Igpu -Icore gpu/stage343_bmodel_source.c \
            gpu/stage344_bmodel_rig.c gpu/stage345_bmodel_mesh_bridge.c \
            core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c \
            tests/gpu/test_stage345_bmodel_mesh_bridge.c -lm \
            -o /tmp/stage345-sanitize
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 /tmp/stage345-sanitize

  devkita64:
    name: Nintendo Switch AArch64 compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Compile bridge and skinning core for devkitA64
        run: |
          set -eu
          compiler="/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc"
          test -x "$compiler"
          for source in \
            gpu/stage343_bmodel_source.c \
            gpu/stage344_bmodel_rig.c \
            gpu/stage345_bmodel_mesh_bridge.c \
            core/rigmesh_io.c core/skeletal_skin.c core/banim_core.c; do
            object="/tmp/$(basename "$source" .c).o"
            "$compiler" -std=c99 -O2 -Wall -Wextra -Werror -pedantic \
              -ffreestanding -Igpu -Icore -c "$source" -o "$object"
            test -s "$object"
          done
