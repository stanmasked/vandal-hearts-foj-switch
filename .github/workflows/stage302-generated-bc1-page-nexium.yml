name: Stage302 real NeXium GPU renders C-decoded generated BC1 1024 page

on:
  pull_request:
    paths:
      - '.github/workflows/stage302-generated-bc1-page-nexium.yml'
      - 'gpu/stage302_generated_page.mk'
      - 'gpu/stage302_synthetic_page_probe.c'
      - 'gpu/stage302_synthetic_page_probe.h'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/bc1_atlas_page.c'
      - 'gpu/bc1_atlas_page.h'
      - 'tests/gpu/test_stage302_synthetic_page.c'
      - 'tools/foj_stage302_generated_bc1_page_guest.py'
      - 'tests/emulator/test_stage302_generated_bc1_page_guest.py'
      - 'docs/GPU_STAGE302_NATIVE_BC1_PAGE_NEXIUM.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage302-generated-page-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host C generated-only page probe / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: ['gcc','clang']
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run actual Stage302 C shader-input guard
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Werror -Igpu \
            gpu/atlas_dds.c gpu/bc1_atlas_page.c \
            gpu/stage302_synthetic_page_probe.c \
            tests/gpu/test_stage302_synthetic_page.c \
            -o /tmp/stage302-native-probe
          /tmp/stage302-native-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse forged guest frame and file publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage302_generated_bc1_page_guest.py' -v
          echo STAGE302_HOST_C_AND_EVIDENCE_NEGATIVE_PASS

  build:
    name: Compile opt-in Stage302 native NRO and UAM DKSH on devkitA64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build real NRO with actual C BC1 page path
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/stage302_generated_page.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-stage302-generated-page.nro
          echo STAGE302_DEVKITA64_REAL_NATIVE_PAGE_NRO_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage302-nro-generated-shaders
          path: |
            build/foj-deko3d-stage302-generated-page.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Two real NeXium GPU frames prove BC1 decoded page selected
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage302-nro-generated-shaders
          path: native
      - name: Install Mesa Vulkan, framebuffer capture and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Download NeXium nightly and bind its archive identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Prepare generated-only Stage293 inputs and check native page guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage302_generated_bc1_page_guest.py' -v
          bash -n tools/foj_stage274_nexium_pass_drive.sh
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          work="$RUNNER_TEMP/stage302-invented-bc1-source"
          evidence="$GITHUB_WORKSPACE/runtime-evidence/bridge"
          python3 -m tools.foj_stage293_converted_dds_guest prepare \
            --work-root "$work" --shaders native/gpu/build --evidence "$evidence"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$work" --evidence "$evidence" --phase before
          echo "NEXIUM_DATA_ROOT=$work/staged" >> "$GITHUB_ENV"
          echo "FOJ_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
      - name: Render actual Stage301 C page decoder output in NeXium
        shell: bash
        env:
          FOJ_DYNAMIC_CASE: original
        run: |
          set -euo pipefail
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-stage302-generated-page.nro"
          sd="$NEXIUM_DATA_ROOT/sdmc/switch/foj/gpu"
          marker="$sd/foj-native-stage302-paged-pass.txt"
          test ! -e "$marker" && test ! -L "$marker"
          timeout --kill-after=5s 240s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage274_nexium_pass_drive.sh
          test -f "$marker" && test ! -L "$marker"
          cp -- "$marker" "$FOJ_EVIDENCE_DIR/native-stage302-paged-pass.txt"
          python3 -m tools.foj_stage293_converted_dds_guest attest \
            --work-root "$(dirname "$NEXIUM_DATA_ROOT")" \
            --evidence "$FOJ_EVIDENCE_DIR" --phase after
      - name: Independently audit two GPU frames and exact 256-page identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage302_generated_bc1_page_guest audit \
            --evidence runtime-evidence/bridge
          echo STAGE302_REAL_NEIXUM_GENERATED_BC1_PAGE_GPU_PASS
      - name: Publish only verified generated frames and attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage302_generated_bc1_page_guest publish \
            --source runtime-evidence \
            --output runtime-evidence-public
          echo STAGE302_STRICT_TEN_FILE_EVIDENCE_EXPORT_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foj-stage302-real-guest-generated-bc1-page-proof
          path: runtime-evidence-public/
          if-no-files-found: error
          # Raw guest.log and Stage286 private material manifest never uploaded.
