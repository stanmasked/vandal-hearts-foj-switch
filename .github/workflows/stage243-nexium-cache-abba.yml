name: Stage 243 NeXium paired cache rendering costs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage243-nexium-cache-abba.yml'
      - 'tools/foj_stage243_paired_guest_check.py'
      - 'tools/foj_stage238_nexium_drive.sh'
      - 'tests/emulator/test_stage243_paired_guest_check.py'
      - 'switch/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage243-nexium-cache-abba.yml'
      - 'tools/foj_stage243_paired_guest_check.py'
      - 'tools/foj_stage238_nexium_drive.sh'
      - 'tests/emulator/test_stage243_paired_guest_check.py'
      - 'switch/**'
      - 'core/**'

permissions:
  contents: read

jobs:
  build:
    name: Build both experimental guest NRO variants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce matched cache and uncached NRO builds
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile \
            build/foj-isometric-research.nro \
            build/foj-isometric-research-uncached.nro
          python3 tools/validate_nro.py build/foj-isometric-research.nro
          python3 tools/validate_nro.py build/foj-isometric-research-uncached.nro
          test "$(sha256sum build/foj-isometric-research.nro | cut -d' ' -f1)" != \
               "$(sha256sum build/foj-isometric-research-uncached.nro | cut -d' ' -f1)"
      - name: Preserve identical-source experiment executables
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage243-abba-two-builds
          path: build/foj-isometric-research*.nro
          if-no-files-found: error

  nexium:
    name: Measure four same-runner NeXium guests in ABBA order
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage243-abba-two-builds
          path: nros
      - name: Install Vulkan guest and Python screenshot dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Resolve one NeXium archive for all four guest processes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium pair-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > pair-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Verify 14 synthetic anti-fraud paired controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage243_paired_guest_check.py' -v
      - name: Execute real guest ABBA sequence with identical controls
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          test -s nros/foj-isometric-research.nro
          test -s nros/foj-isometric-research-uncached.nro
          for condition in cached_first uncached_first uncached_second cached_second; do
            case "$condition" in
              cached_*) export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-research.nro";;
              uncached_*) export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-research-uncached.nro";;
              *) exit 2;;
            esac
            export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/pair-evidence/$condition"
            mkdir -p "$FOJ_EVIDENCE_DIR"
            cp pair-evidence/nexium-archive.sha256 "$FOJ_EVIDENCE_DIR/nexium-archive.sha256"
            sha256sum "$FOJ_NRO" > "$FOJ_EVIDENCE_DIR/nro.sha256"
            timeout --kill-after=5s 230s xvfb-run -a \
              -s "-screen 0 1280x720x24" \
              bash tools/foj_stage238_nexium_drive.sh
            echo "Stage243 NeXium guest $condition captured"
          done
      - name: Require pixel-identical gameplay and decode paired guest costs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage243_paired_guest_check \
            --evidence-root pair-evidence \
            --report pair-evidence/stage243-abba-summary.json
          python3 -m json.tool pair-evidence/stage243-abba-summary.json >/dev/null
      - name: Archive 36 real frames, hashes, guest logs and ABBA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage243-abba-guest-evidence
          path: pair-evidence/
          if-no-files-found: warn
