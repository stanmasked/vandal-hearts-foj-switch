name: Stage295 private source integrity gate (synthetic CI only)

on:
  pull_request:
    paths:
      - '.github/workflows/stage295-owner-local-integrity.yml'
      - 'tools/foj_stage295_owner_local_source_integrity.py'
      - 'tests/emulator/test_stage295_owner_local_source_integrity.py'
      - 'tools/foj_stage294_owner_local_gtf_envelope.py'
      - 'tools/foj_fd_bound_reader.py'
      - 'docs/GPU_STAGE295_OWNER_LOCAL_SOURCE_IDENTITY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage295-private-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-identity:
    name: Owner-held digest and private path protection / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify synthetic-only source digest gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/foj_stage295_owner_local_source_integrity.py
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage295_owner_local_source_integrity.py' -v
          echo STAGE295_SYNTHETIC_OWNER_HELD_SOURCE_IDENTITY_PASS
      # Explicitly no PS3 input, public source digest, image output or artifacts.
