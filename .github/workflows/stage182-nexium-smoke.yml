name: Stage 186 NeXium COLL cursor and zoom limits

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/foj_stage182_nexium_frame_check.py'
      - 'tools/foj_stage183_coll_y_frame_check.py'
      - 'tools/foj_stage184_coll_input_check.py'
      - 'tools/foj_stage185_coll_reverse_check.py'
      - 'tools/foj_stage186_coll_boundary_check.py'
      - 'tools/foj_stage183_coll_mode_reference.c'
      - 'tests/emulator/**'
      - 'switch/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - 'tools/foj_stage182_nexium_frame_check.py'
      - 'tools/foj_stage183_coll_y_frame_check.py'
      - 'tools/foj_stage184_coll_input_check.py'
      - 'tools/foj_stage185_coll_reverse_check.py'
      - 'tools/foj_stage186_coll_boundary_check.py'
      - 'tools/foj_stage183_coll_mode_reference.c'
      - 'switch/**'
      - 'core/**'

permissions:
  contents: read

concurrency:
  group: foj-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build two generated-only Switch research NROs
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate nine independent libnx research NROs
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile verify
      - name: Upload only two synthetic programs for NeXium
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage182-nexium-nros
          path: |
            build/foj-isometric-research.nro
            build/foj-coll-map-research.nro
          if-no-files-found: error

  nexium:
    name: Launch two NRO guests and validate actual screenshots
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage182-nexium-nros
          path: nros
      - name: Install headless display and Vulkan Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers

      - name: Fetch executable from pinned NeXium nightly channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$asset_url"
          curl -fL --retry 3 --retry-all-errors "$asset_url" -o /tmp/nexium-linux.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          emu_bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          if [ -z "$emu_bin" ]; then
            emu_bin="$(find /tmp/nexium -type f -executable ! -name 'ffmpeg' -print -quit)"
          fi
          test -n "$emu_bin"
          echo "NEXIUM_BIN=$emu_bin" >> "$GITHUB_ENV"
          ldd "$emu_bin" || true
          mkdir -p runtime-evidence
          sha256sum /tmp/nexium-linux.tar.gz | awk '{print $1"  nexium-linux-x86_64.tar.gz"}' > runtime-evidence/nexium-archive-sha256.txt

      - name: Regression-test fail-closed guest screenshot classifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator -p 'test_stage182_frame_check.py' -v

      - name: Compile native C reference screens for both generated COLL modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore \
            tools/foj_stage183_coll_mode_reference.c \
            core/coll_view.c core/coll_iso_view.c -lm \
            -o /tmp/foj-stage183-coll-reference
          /tmp/foj-stage183-coll-reference heatmap runtime-evidence/ref-coll-heat.ppm
          /tmp/foj-stage183-coll-reference isometric runtime-evidence/ref-coll-iso.ppm
          python3 tools/ppm_to_png.py runtime-evidence/ref-coll-heat.ppm \
            runtime-evidence/ref-coll-heat.png
          python3 tools/ppm_to_png.py runtime-evidence/ref-coll-iso.ppm \
            runtime-evidence/ref-coll-iso.png
          rm runtime-evidence/ref-coll-heat.ppm runtime-evidence/ref-coll-iso.ppm

      - name: Render eight generated-only native C cursor/zoom/channel references
        shell: bash
        run: |
          set -euo pipefail
          while read -r state cx cy tile channel; do
            /tmp/foj-stage183-coll-reference heatmap \
              "runtime-evidence/ref-coll-$state.ppm" \
              "$cx" "$cy" "$tile" "$channel"
            python3 tools/ppm_to_png.py \
              "runtime-evidence/ref-coll-$state.ppm" \
              "runtime-evidence/ref-coll-$state.png"
            rm "runtime-evidence/ref-coll-$state.ppm"
          done <<'COLL_STATES'
          cursor-right 26 25 12 0
          zoom 26 25 14 0
          ch1 26 25 14 1
          ch2 26 25 14 2
          ch3 26 25 14 3
          ch4 26 25 14 4
          ch5 26 25 14 5
          ch0 26 25 14 0
          COLL_STATES

      - name: Regress generated-only COLL edge and zoom verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage186_coll_boundary_check.py' -v

      - name: Regress six-channel screenshot checker against synthetic mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage184_coll_input_check.py' -v

      - name: Generate six exact C heatmap references for COLL edges and zoom bounds
        shell: bash
        run: |
          set -euo pipefail
          while read -r state cx cy tile; do
            /tmp/foj-stage183-coll-reference heatmap \
              "runtime-evidence/ref-coll-$state.ppm" \
              "$cx" "$cy" "$tile" 0
            python3 tools/ppm_to_png.py \
              "runtime-evidence/ref-coll-$state.ppm" \
              "runtime-evidence/ref-coll-$state.png"
            rm "runtime-evidence/ref-coll-$state.ppm"
          done <<'COLL_BOUNDS'
          left-edge 0 25 12
          top-edge 0 0 12
          min-zoom 0 0 4
          max-zoom 0 0 30
          right-edge 49 0 30
          bottom-edge 49 49 30
          COLL_BOUNDS

      - name: Regress classifier against seven synthetic negative/positive scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage183_coll_y_frame_check.py' -v

      - name: Capture guest frames and emulated route selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"

          capture() {
            export NRO="$1" SHOT="$2" ROUTE="$3" INPUT="$4" LOG="$5" BACK="${6:-}"
            test -s "$NRO"
            timeout --kill-after=5s 300s xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
              set -euo pipefail
              "$NEXIUM_BIN" "$NRO" >"$LOG" 2>&1 &
              pid=$!
              trap "kill -KILL $pid 2>/dev/null || true" EXIT
              for i in $(seq 1 30); do
                sleep 1
                state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " " || true)"
                if [ -z "$state" ] || [[ "$state" == Z* ]] || ! kill -0 "$pid" 2>/dev/null; then
                  echo "NRO guest process exited prematurely" >&2
                  tail -n 80 "$LOG" >&2
                  exit 1
                fi
              done
              window="$(xdotool search --onlyvisible --name "NeXium" 2>/dev/null | tail -n 1 || true)"
              test -n "$window"
              timeout --kill-after=2s 10s import -window "$window" "$SHOT"
              if [ "$INPUT" = "1" ]; then
                # Verified default NeXium keyboard mapping: c = Switch A,
                # Left/Right arrows = d-pad. Select hero and move cursor
                # two cells to the right; only a real guest frame can
                # contain the gold route dots.
                timeout --kill-after=1s 3s xdotool windowfocus --sync "$window" || true
                timeout --kill-after=1s 3s xdotool keydown --window "$window" c
                sleep 0.15
                timeout --kill-after=1s 3s xdotool keyup --window "$window" c
                sleep 0.3
                for press in 1 2; do
                  timeout --kill-after=1s 3s xdotool keydown --window "$window" Right
                  sleep 0.15
                  timeout --kill-after=1s 3s xdotool keyup --window "$window" Right
                  sleep 0.3
                done
                timeout --kill-after=2s 10s import -window "$window" "$ROUTE"
              fi
              if [ "$INPUT" = "2" ]; then
                # Confirmed in NeXium source controller_config.rs:
                # default Switch Y = keyboard Z. Record both transitions.
                timeout --kill-after=1s 3s xdotool windowfocus --sync "$window" || true
                for stage in first second; do
                  timeout --kill-after=1s 3s xdotool keydown --window "$window" z
                  sleep 0.18
                  timeout --kill-after=1s 3s xdotool keyup --window "$window" z
                  sleep 0.65
                  if [ "$stage" = "first" ]; then
                    timeout --kill-after=2s 10s import -window "$window" "$ROUTE"
                  else
                    timeout --kill-after=2s 10s import -window "$window" "$BACK"
                  fi
                done
              fi
              if [ "$INPUT" = "2" ]; then
                # NeXium controller_config.rs defaults:
                # DRight=Right, ZR=T, R=E; held press/release per state.
                for item in "Right cursor-right" "t zoom" \
                  "e ch1" "e ch2" "e ch3" "e ch4" "e ch5" "e ch0"; do
                  read -r key state <<< "$item"
                  timeout --kill-after=1s 3s xdotool keydown --window "$window" "$key"
                  sleep 0.18
                  timeout --kill-after=1s 3s xdotool keyup --window "$window" "$key"
                  sleep 0.55
                  timeout --kill-after=2s 10s import -window "$window" \
                    "runtime-evidence/coll-$state.png"
                done
                # Following six R presses, reverse raw channel, zoom and
                # cursor using NeXium source-proven Q=L, R=ZL, Left=DLeft.
                for item in "q reverse-l" "e return-r" \
                            "r reverse-zl" "Left reverse-left"; do
                  read -r key state <<< "$item"
                  timeout --kill-after=1s 3s xdotool keydown --window "$window" "$key"
                  sleep 0.18
                  timeout --kill-after=1s 3s xdotool keyup --window "$window" "$key"
                  sleep 0.55
                  timeout --kill-after=2s 10s import -window "$window" \
                    "runtime-evidence/coll-$state.png"
                done
                # Clamped COLL cursor and zoom boundaries. Emulator
                # default keys Left/Up/Right/Down and R=ZL, T=ZR.
                # Repeated key events (not a held key) exercise the
                # actual guest PadState button-down edges.
                for item in "Left left-edge 40" \
                            "Up top-edge 40" \
                            "r min-zoom 10" \
                            "t max-zoom 20" \
                            "Right right-edge 65" \
                            "Down bottom-edge 65"; do
                  read -r key state count <<< "$item"
                  timeout --kill-after=2s 90s xdotool key --clearmodifiers \
                    --repeat "$count" --delay 280 --window "$window" "$key"
                  sleep 0.75
                  timeout --kill-after=2s 10s import -window "$window" \
                    "runtime-evidence/coll-$state.png"
                  timeout --kill-after=2s 15s xdotool key --clearmodifiers \
                    --repeat 4 --delay 350 --window "$window" "$key"
                  sleep 0.75
                  timeout --kill-after=2s 10s import -window "$window" \
                    "runtime-evidence/coll-$state-repeat.png"
                done
              fi
              test -s "$SHOT"
              if [ "$INPUT" = "1" ]; then test -s "$ROUTE"; fi
              if [ "$INPUT" = "2" ]; then test -s "$ROUTE" && test -s "$BACK"; fi
              kill -INT "$pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            '
          }

          capture "nros/foj-isometric-research.nro" \
            "runtime-evidence/iso-initial.png" \
            "runtime-evidence/iso-selected-route.png" \
            "1" "runtime-evidence/iso.log"

          capture "nros/foj-coll-map-research.nro" \
            "runtime-evidence/coll-synthetic.png" \
            "runtime-evidence/coll-isometric-after-y.png" \
            "2" "runtime-evidence/coll.log" \
            "runtime-evidence/coll-heat-return-after-y.png"

      - name: Reject fake, blank, static or missing guest output
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/foj_stage182_nexium_frame_check.py \
            --iso runtime-evidence/iso-initial.png \
            --iso-route runtime-evidence/iso-selected-route.png \
            --coll runtime-evidence/coll-synthetic.png \
            --report runtime-evidence/stage182-emulator-receipt.json

      - name: Verify actual Y roundtrip versus independent portable C screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/foj_stage183_coll_y_frame_check.py \
            --heat runtime-evidence/coll-synthetic.png \
            --iso runtime-evidence/coll-isometric-after-y.png \
            --restored runtime-evidence/coll-heat-return-after-y.png \
            --reference-heat runtime-evidence/ref-coll-heat.png \
            --reference-iso runtime-evidence/ref-coll-iso.png \
            --output runtime-evidence/stage183-coll-y-guest-receipt.json

      - name: Check actual NeXium D-pad cursor, ZR zoom and all six COLL raw channels
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/foj_stage184_coll_input_check.py \
            --evidence runtime-evidence \
            --report runtime-evidence/stage184-coll-input-guest-receipt.json

      - name: Verify opposite L/R, ZL and DLeft actions on actual NeXium guest frames
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage185_coll_reverse_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage185-coll-reverse-guest-receipt.json

      - name: Verify real NeXium COLL cursor and zoom extrema and repeated no-op input
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage186_coll_boundary_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage186-coll-bounds-guest-receipt.json

      - name: Preserve screenshots, analysis and sanitized startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage186-nexium-coll-bounds-evidence
          path: runtime-evidence/
          if-no-files-found: warn
