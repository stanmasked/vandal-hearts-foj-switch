name: Stage264 actual deko3d alpha cutout and depth proof in NeXium

on:
  pull_request:
    paths:
      - '.github/workflows/stage264-gpu-alpha-cutout.yml'
      - 'tools/foj_stage264_*'
      - 'tests/emulator/test_stage264_gpu_alpha_cutout.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/alpha_draw.mk'
      - 'gpu/private_bundle_intake.*'
      - 'gpu/Makefile'
      - 'gpu/shaders/foj_alpha_cutout.frag'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage264-gpu-alpha-cutout.yml'
      - 'tools/foj_stage264_*'
      - 'tests/emulator/test_stage264_gpu_alpha_cutout.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/alpha_draw.mk'
      - 'gpu/Makefile'
      - 'gpu/shaders/foj_alpha_cutout.frag'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build real opt-in NRO and generated UAM shader pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Compile Stage264 alpha discard and depth enabled NRO with real UAM shaders
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/alpha_draw.mk verify
          make -f gpu/Makefile triangle-verify
          make -f gpu/Makefile alpha-verify
          python3 tools/validate_nro.py build/foj-deko3d-alpha-cutout-proof.nro
          python3 -m tools.validate_dksh --expect-stage vertex gpu/build/foj_actor.vert.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_triangle.frag.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_alpha_cutout.frag.dksh
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage264-alpha-gpu-program
          path: |
            build/foj-deko3d-alpha-cutout-proof.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
            gpu/build/foj_alpha_cutout.frag.dksh
          if-no-files-found: error

  nexium:
    name: Require real GPU screenshot evidence from generated SD
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage264-alpha-gpu-program
          path: native
      - name: Install headless display Vulkan and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Run synthetic-only generator and anti-fake screenshot unit checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage260_generated_gpu_visual.py' -v
      - name: Fetch NeXium nightly executable and record provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run seven generated-only alpha acceptance and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage264_gpu_alpha_cutout.py' -v
          bash -n tools/foj_stage263_nexium_depth_drive.sh
      - name: Run TWO separate actual NeXium alpha and opaque GPU scenarios
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-alpha-cutout-proof.nro"
          for scene in masked opaque; do
            root="$RUNNER_TEMP/stage264-generated-$scene"
            mkdir -p "runtime-evidence/$scene"
            python3 -m tools.foj_stage264_generated_alpha_sd \
              --data-root "$root" --shaders native/gpu/build \
              --scenario "$scene" \
              > "runtime-evidence/$scene/generated-input.json"
            export NEXIUM_DATA_ROOT="$root"
            export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence/$scene"
            timeout --kill-after=5s 180s xvfb-run -a \
              -s "-screen 0 1280x720x24" \
              bash tools/foj_stage263_nexium_depth_drive.sh
            python3 -m tools.foj_stage260_gpu_guest_check \
              --evidence "$FOJ_EVIDENCE_DIR" \
              --report "$FOJ_EVIDENCE_DIR/stage260-material-presence.json"
          done
      - name: Require genuine cutout and full-opaque depth counterfactual
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage264_gpu_alpha_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage264-alpha-guest-receipt.json
      - name: Preserve synthetic-only guest captures and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage264-alpha-guest-evidence
          path: runtime-evidence/
          if-no-files-found: warn
