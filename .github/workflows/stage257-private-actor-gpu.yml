name: Stage257 private actor to GPU stream contract

on:
  pull_request:
    paths:
      - '.github/workflows/stage257-private-actor-gpu.yml'
      - 'gpu/private_actor_bridge.*'
      - 'tests/test_gpu_private_actor_bridge.c'
      - 'core/rigmesh_io.*'
      - 'core/material_table.*'
      - 'core/gpu_vertex_stream.*'
      - 'core/gpu_draw_plan.*'
      - 'gpu/actor_upload_plan.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage257-private-actor-gpu.yml'
      - 'gpu/private_actor_bridge.*'
      - 'tests/test_gpu_private_actor_bridge.c'
      - 'core/rigmesh_io.*'
      - 'core/material_table.*'
      - 'core/gpu_vertex_stream.*'
      - 'core/gpu_draw_plan.*'
      - 'gpu/actor_upload_plan.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Generated-only private actor bridge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11 NDEBUG and ASan UBSan generated actor fixture
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          mkdir -p build
          sources="tests/test_gpu_private_actor_bridge.c gpu/private_actor_bridge.c gpu/actor_upload_plan.c core/rigmesh_io.c core/material_table.c core/gpu_vertex_stream.c core/gpu_draw_plan.c"
          for mode in strict ndebug sanitized; do
            flags="-std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -Icore -Igpu"
            case "$mode" in
              strict) ;;
              ndebug) flags="$flags -DNDEBUG" ;;
              sanitized) flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer" ;;
            esac
            "$CC" $flags $sources -lm -o "build/stage257-$CC-$mode"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "./build/stage257-$CC-$mode"
          done

  native:
    name: Compile private FOJRM FOJMAT GPU adapter for ARM64
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable actor bridge using devkitA64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for source in gpu/private_actor_bridge.c core/rigmesh_io.c core/material_table.c; do
            output="build/$(basename "$source" .c).o"
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
              -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Icore -Igpu \
              -c "$source" -o "$output"
          done
