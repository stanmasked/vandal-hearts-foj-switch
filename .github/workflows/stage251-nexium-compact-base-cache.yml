name: Stage 251 NeXium compact base-cache heap scaling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage251-nexium-compact-base-cache.yml'
      - 'core/base_cache_compact.*'
      - 'core/base_cache_scale_probe.*'
      - 'tests/test_stage251_*'
      - 'tests/emulator/test_stage251_*'
      - 'tools/foj_stage251_*'
      - 'core/base_cache_stability_probe.*'
      - 'core/battle_scene_key.h'
      - 'tests/test_stage248_*'
      - 'tests/test_stage249_*'
      - 'core/base_cache_pair_probe.*'
      - 'core/isometric_demo.*'
      - 'core/isometric_base_cache.h'
      - 'switch/source/iso_main.c'
      - 'switch/Makefile'
      - 'tools/foj_stage250_*'
      - 'tests/test_stage250_*'
      - 'tests/emulator/test_stage250_*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage251-nexium-compact-base-cache.yml'
      - 'core/base_cache_compact.*'
      - 'core/base_cache_scale_probe.*'
      - 'core/battle_scene_key.h'
      - 'core/base_cache_pair_probe.*'
      - 'switch/source/iso_main.c'
      - 'switch/Makefile'

permissions:
  contents: read

jobs:
  native:
    name: GCC Clang UBSan exact-sized compact base heap and prior-stage tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stage251 allocation, reuse, release, stride, budget and pixel parity tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          common="-std=c11 -Wall -Wextra -Werror -pedantic -O2 -Icore -DFOJ_STAGE251_COMPACT=1"
          inputs="tests/test_stage251_compact_cache.c core/base_cache_compact.c core/base_cache_scale_probe.c core/base_cache_stability_probe.c core/base_cache_pair_probe.c core/isometric_demo.c core/tactical_battle.c core/tactical_demo.c"
          gcc $common $inputs -o build/stage251-gcc -lm
          clang $common $inputs -o build/stage251-clang -lm
          gcc $common -fsanitize=undefined -fno-sanitize-recover=all $inputs -o build/stage251-ubsan -lm
          ./build/stage251-gcc
          ./build/stage251-clang
          UBSAN_OPTIONS=halt_on_error=1 ./build/stage251-ubsan
      - name: Stage248/249 and Stage250 fixed-storage regression on GCC Clang UBSan
        shell: bash
        run: |
          set -euo pipefail
          common="-std=c11 -Wall -Wextra -Werror -pedantic -O2 -Icore"
          shared="core/base_cache_pair_probe.c core/isometric_demo.c core/tactical_battle.c core/tactical_demo.c"
          for stage in 248 249; do
            if [ "$stage" -eq 248 ]; then
              inputs="tests/test_stage248_base_cache_pair_probe.c $shared"
            else
              inputs="tests/test_stage249_base_cache_stability.c core/base_cache_stability_probe.c $shared"
            fi
            gcc $common $inputs -o "build/stage${stage}-g" -lm
            clang $common $inputs -o "build/stage${stage}-c" -lm
            gcc $common -fsanitize=undefined -fno-sanitize-recover=all \
              $inputs -o "build/stage${stage}-u" -lm
            "./build/stage${stage}-g"
            "./build/stage${stage}-c"
            UBSAN_OPTIONS=halt_on_error=1 "./build/stage${stage}-u"
          done
          # Stage250 must still work with fixed cache (flag disabled).
          inputs="tests/test_stage250_base_cache_scale.c core/base_cache_scale_probe.c core/base_cache_stability_probe.c core/base_cache_pair_probe.c core/isometric_demo.c core/tactical_battle.c core/tactical_demo.c"
          gcc $common $inputs -o build/stage250-gcc -lm
          clang $common $inputs -o build/stage250-clang -lm
          gcc $common -fsanitize=undefined -fno-sanitize-recover=all \
            $inputs -o build/stage250-ubsan -lm
          ./build/stage250-gcc
          ./build/stage250-clang
          UBSAN_OPTIONS=halt_on_error=1 ./build/stage250-ubsan

  build:
    name: devkitA64 research-only compact-base-cache NRO
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify Switch NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f switch/Makefile build/foj-isometric-compact-base-cache.nro
          python3 tools/validate_nro.py build/foj-isometric-compact-base-cache.nro
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage251-compact-base-cache-nro
          path: build/foj-isometric-compact-base-cache.nro
          if-no-files-found: error

  nexium:
    name: Nine real NeXium states: compact heap memory and inherited raster timing
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage251-compact-base-cache-nro
          path: nros
      - name: Install NeXium Vulkan and screenshot requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Resolve pinned-by-hash nightly NeXium archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexium guest-evidence
          json="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r \
            '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 --retry-all-errors "$url" -o /tmp/nexium-linux.tar.gz
          sha256sum /tmp/nexium-linux.tar.gz > guest-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium-linux.tar.gz -C /tmp/nexium
          binary="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$binary"
          echo "NEXIUM_BIN=$binary" >> "$GITHUB_ENV"
      - name: Decoder mutation tests and inherited stages 238-250
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage251_compact_guest_check.py' -v
      - name: Capture nine genuine NeXium battle states
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/nros/foj-isometric-compact-base-cache.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/guest-evidence"
          sha256sum "$FOJ_NRO" > guest-evidence/nro.sha256
          test -s "$FOJ_NRO"
          timeout --kill-after=5s 260s xvfb-run -a \
            -s "-screen 0 1280x720x24" \
            bash tools/foj_stage245_nexium_drive.sh
      - name: Verify exact KiB payload and inherited Stage250 proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage251_compact_guest_check \
            --initial guest-evidence/cache-initial.png \
            --selected guest-evidence/cache-selected.png \
            --hovered guest-evidence/cache-hovered.png \
            --hidden guest-evidence/cache-hidden.png \
            --restored guest-evidence/cache-restored.png \
            --cancelled guest-evidence/cache-cancelled.png \
            --guarded guest-evidence/cache-guarded.png \
            --guard-hovered guest-evidence/cache-guard-hovered.png \
            --ended guest-evidence/cache-ended.png \
            --report guest-evidence/stage251-compact-heap-evidence.json
      - name: Preserve NeXium raster evidence, binary hashes and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage251-NeXium-compact-memory
          path: guest-evidence/
          if-no-files-found: warn
