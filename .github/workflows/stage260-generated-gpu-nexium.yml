name: Stage260 generated two-material GPU NeXium visual proof

on:
  pull_request:
    paths:
      - '.github/workflows/stage260-generated-gpu-nexium.yml'
      - 'tools/foj_stage260_*'
      - 'tests/emulator/test_stage260_generated_gpu_visual.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/private_draw.mk'
      - 'gpu/private_bundle_intake.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage260-generated-gpu-nexium.yml'
      - 'tools/foj_stage260_*'
      - 'tests/emulator/test_stage260_generated_gpu_visual.py'
      - 'gpu/deko3d_clear_main.c'
      - 'gpu/private_draw.mk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build real opt-in NRO and generated UAM shader pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Stage259 opt-in NRO and verify both DKSH stages
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/private_draw.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-private-actor-upload.nro
          python3 -m tools.validate_dksh --expect-stage vertex gpu/build/foj_actor.vert.dksh
          python3 -m tools.validate_dksh --expect-stage fragment gpu/build/foj_triangle.frag.dksh
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage260-generated-only-gpu-program
          path: |
            build/foj-deko3d-private-actor-upload.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error

  nexium:
    name: Require real GPU screenshot evidence from generated SD
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage260-generated-only-gpu-program
          path: native
      - name: Install headless display Vulkan and Pillow
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
      - name: Run synthetic-only generator and anti-fake screenshot unit checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/emulator \
            -p 'test_stage260_generated_gpu_visual.py' -v
      - name: Fetch NeXium nightly executable and record provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Populate isolated generated-only virtual SD (never use private assets)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/stage260-invented-gpu-sd"
          python3 -m tools.foj_stage260_generated_gpu_sd \
            --data-root "$root" --shaders native/gpu/build \
            > runtime-evidence/stage260-generated-input.json
          for name in actor.fojrm actor.fojmat material0.dds material1.dds \
            foj_actor.vert.dksh foj_triangle.frag.dksh; do
            test -s "$root/sdmc/switch/foj/gpu/$name"
          done
          echo "NEXIUM_DATA_ROOT=$root" >> "$GITHUB_ENV"
      - name: Launch actual GPU guest and capture two frames (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export FOJ_NRO="$GITHUB_WORKSPACE/native/build/foj-deko3d-private-actor-upload.nro"
          export FOJ_EVIDENCE_DIR="$GITHUB_WORKSPACE/runtime-evidence"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1280x720x24" \
            bash tools/foj_stage260_nexium_gpu_drive.sh
      - name: Demand red and cyan GPU triangles in both actual screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage260_gpu_guest_check \
            --evidence runtime-evidence \
            --report runtime-evidence/stage260-gpu-guest-receipt.json
      - name: Preserve synthetic-only guest captures and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foj-stage260-generated-gpu-guest-evidence
          path: runtime-evidence/
          if-no-files-found: warn
