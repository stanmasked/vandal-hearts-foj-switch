      - "tests/test_foj_source_coherence_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-unit-tests:
    name: Texture inventory (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reject oversized or unstable source directory listings
        run: python -m unittest discover -s tests -p 'test_foj_bounded_directory_membership.py' -v
      - name: Test fd-relative source directory enumeration
        run: python -m unittest discover -s tests -p 'test_foj_fd_directory_inventory.py' -v
      - name: Reject fd-open path substitution and symlink swaps
        run: python -m unittest discover -s tests -p 'test_foj_fd_bound_reader.py' -v
      - name: Enforce global DDS candidate and JSON byte budgets
        run: python -m unittest discover -s tests -p 'test_foj_global_candidate_budget.py' -v
      - name: Test same-size DDS rewrites and complete two-pass byte replay
        run: python -m unittest discover -s tests -p 'test_foj_two_pass_dds_integrity.py' -v
      - name: Validate fixed Switch DDS slots against actual C atlas decoder
        run: python -m unittest discover -s tests -p 'test_foj_gpu_local_dds_preflight.py' -v
      - name: Test two synthetic Switch checkerboards and exclusive staging
        run: python -m unittest discover -s tests -p 'test_foj_stage162_synthetic_dds.py' -v
      - name: Validate research-only Switch SD ZIP construction
        run: python -m unittest discover -s tests -p 'test_foj_stage165_sd_bundle.py' -v
      - name: Validate offline-only human GPU observations and ZIP provenance
        run: python -m unittest discover -s tests -p 'test_foj_stage166_hardware_observations.py' -v
      - name: Validate local-only early GPU CPU boot event parsing and relaunch
        run: python -m unittest discover -s tests -p 'test_foj_stage168_boot_journal_audit.py' -v
      - name: Stage 169 cross-check two-run CPU recovery against real C journal writer
        run: python -m unittest discover -s tests -p 'test_foj_stage169_two_attempt_recovery.py' -v
      - name: Stage 170 require explicit operator link for CPU and visual statements
        run: python -m unittest discover -s tests -p 'test_foj_stage170_cpu_visual_alignment.py' -v
      - name: Stage 171 reject mixed CI build identities and NRO copies
        run: python -m unittest discover -s tests -p 'test_foj_stage171_build_identity.py' -v
      - name: Run synthetic DDS metadata scan regressions
        run: python -m unittest discover -s tests -p 'test_foj_texture_probe.py' -v
      - name: Test indexed DDS span and table equivalence under synthetic load
        run: python -m unittest discover -s tests -p 'test_foj_stage157_indexed_search.py' -v
      - name: Stage 158 synthetic benchmark regression and repeatability
        run: python -m unittest discover -s tests -p 'test_foj_stage158_benchmark.py' -v
      - name: Verify generated-only CPU profiling and privacy filters
        run: python -m unittest discover -s tests -p 'test_foj_stage159_profile.py' -v
      - name: Test candidate layout and local pointer hints
        run: python -m unittest discover -s tests -p 'test_foj_texture_relations.py' -v
      - name: Test DDS pointer table hypothesis detection
        run: python -m unittest discover -s tests -p 'test_foj_resource_table_hypotheses.py' -v
      - name: Test candidate index columns and negative controls
        run: python -m unittest discover -s tests -p 'test_foj_index_column_controls.py' -v
      - name: Cross-check independent report fields and synthetic contradictions
        run: python -m unittest discover -s tests -p 'test_foj_evidence_triage.py' -v
      - name: Test disjoint private holdout cohorts and non-replication
        run: python -m unittest discover -s tests -p 'test_foj_holdout_replication.py' -v
      - name: Stress deterministic record-count and false-positive variations
        run: python -m unittest discover -s tests -p 'test_foj_stability_matrix.py' -v
      - name: Test damaged DDS headers and broken container reference tables
        run: python -m unittest discover -s tests -p 'test_foj_corrupt_container_matrix.py' -v
      - name: Validate optimized ASCII and UTF-8 JSON byte counting
        run: python -m unittest discover -s tests -p 'test_foj_stage160_fast_json_budget.py' -v
      - name: Reject oversized JSON reports at every pipeline handoff
        run: python -m unittest discover -s tests -p 'test_foj_report_transit_budget.py' -v
      - name: Replay four-stage synthetic DDS reports and detect stale edits
        run: python -m unittest discover -s tests -p 'test_foj_report_replay_audit.py' -v
      - name: Verify full local source snapshots and reject mid-pipeline edits
        run: python -m unittest discover -s tests -p 'test_foj_source_coherence_gate.py' -v
      - name: Collect synthetic timing and Python-allocation diagnostics
        run: python -m tools.foj_stage158_benchmark --profile smoke --repeats 2
      - name: Identify synthetic CPU hotspots by safe function labels
        run: python -m tools.foj_stage159_profile --profile smoke --repeats 2
      - name: Check Python parser and command-line usage
        run: |
          python -m py_compile tools/foj_fd_bound_reader.py tools/foj_texture_probe.py tools/foj_gpu_local_dds_preflight.py tools/foj_stage162_synthetic_dds.py tools/foj_stage165_sd_bundle.py tools/foj_stage166_hardware_observations.py tools/foj_stage168_boot_journal_audit.py tools/foj_stage169_two_attempt_recovery.py tools/foj_stage170_cpu_visual_alignment.py tools/foj_stage171_build_identity.py tools/foj_texture_relations.py tools/foj_resource_table_hypotheses.py tools/foj_stage158_benchmark.py tools/foj_stage159_profile.py tools/foj_index_column_controls.py tools/foj_evidence_triage.py tools/foj_holdout_replication.py tools/foj_stability_matrix.py tools/foj_corrupt_container_matrix.py tools/foj_report_replay_audit.py tools/foj_report_transit_budget.py tools/foj_source_coherence_gate.py tests/test_foj_fd_bound_reader.py tests/test_foj_fd_directory_inventory.py tests/test_foj_bounded_directory_membership.py tests/test_foj_texture_probe.py tests/test_foj_gpu_local_dds_preflight.py tests/test_foj_stage162_synthetic_dds.py tests/test_foj_stage165_sd_bundle.py tests/test_foj_stage166_hardware_observations.py tests/test_foj_stage168_boot_journal_audit.py tests/test_foj_stage169_two_attempt_recovery.py tests/test_foj_stage170_cpu_visual_alignment.py tests/test_foj_stage171_build_identity.py tests/test_foj_two_pass_dds_integrity.py tests/test_foj_global_candidate_budget.py tests/test_foj_texture_relations.py tests/test_foj_stage157_indexed_search.py tests/test_foj_stage158_benchmark.py tests/test_foj_stage159_profile.py tests/test_foj_resource_table_hypotheses.py tests/test_foj_index_column_controls.py tests/test_foj_evidence_triage.py tests/test_foj_holdout_replication.py tests/test_foj_stability_matrix.py tests/test_foj_corrupt_container_matrix.py tests/test_foj_report_replay_audit.py tests/test_foj_report_transit_budget.py tests/test_foj_stage160_fast_json_budget.py tests/test_foj_source_coherence_gate.py
          python -m tools.foj_texture_probe --help
          python -m tools.foj_gpu_local_dds_preflight --help
          python -m tools.foj_stage162_synthetic_dds --help
          python -m tools.foj_stage165_sd_bundle --help
          python -m tools.foj_stage166_hardware_observations --help
          python -m tools.foj_stage168_boot_journal_audit --help
          python -m tools.foj_stage169_two_attempt_recovery --help
