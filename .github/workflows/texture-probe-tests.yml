  push:
    branches: [main]
    paths:
      - ".github/workflows/texture-probe-tests.yml"
      - "tools/foj_fd_bound_reader.py"
      - "tools/foj_texture_probe.py"
      - "tools/foj_texture_relations.py"
      - "tools/foj_resource_table_hypotheses.py"
      - "tools/foj_index_column_controls.py"
      - "tools/foj_evidence_triage.py"
      - "tools/foj_holdout_replication.py"
      - "tools/foj_stability_matrix.py"
      - "tools/foj_corrupt_container_matrix.py"
      - "tools/foj_report_replay_audit.py"
      - "tools/foj_report_transit_budget.py"
      - "tools/foj_source_coherence_gate.py"
      - "tests/test_foj_fd_bound_reader.py"
      - "tests/test_foj_fd_directory_inventory.py"
      - "tests/test_foj_bounded_directory_membership.py"
      - "tests/test_foj_texture_probe.py"
      - "tests/test_foj_two_pass_dds_integrity.py"
      - "tests/test_foj_global_candidate_budget.py"
      - "tests/test_foj_texture_relations.py"
      - "tests/test_foj_stage157_indexed_search.py"
      - "tests/test_foj_resource_table_hypotheses.py"
      - "tests/test_foj_index_column_controls.py"
      - "tests/test_foj_evidence_triage.py"
      - "tests/test_foj_holdout_replication.py"
      - "tests/test_foj_stability_matrix.py"
      - "tests/test_foj_corrupt_container_matrix.py"
      - "tests/test_foj_report_replay_audit.py"
      - "tests/test_foj_report_transit_budget.py"
      - "tests/test_foj_source_coherence_gate.py"
  pull_request:
    paths:
      - ".github/workflows/texture-probe-tests.yml"
      - "tools/foj_fd_bound_reader.py"
      - "tools/foj_texture_probe.py"
      - "tools/foj_texture_relations.py"
      - "tools/foj_resource_table_hypotheses.py"
      - "tools/foj_index_column_controls.py"
      - "tools/foj_evidence_triage.py"
      - "tools/foj_holdout_replication.py"
      - "tools/foj_stability_matrix.py"
      - "tools/foj_corrupt_container_matrix.py"
      - "tools/foj_report_replay_audit.py"
      - "tools/foj_report_transit_budget.py"
      - "tools/foj_source_coherence_gate.py"
      - "tests/test_foj_fd_bound_reader.py"
      - "tests/test_foj_fd_directory_inventory.py"
      - "tests/test_foj_bounded_directory_membership.py"
      - "tests/test_foj_texture_probe.py"
      - "tests/test_foj_two_pass_dds_integrity.py"
      - "tests/test_foj_global_candidate_budget.py"
      - "tests/test_foj_texture_relations.py"
      - "tests/test_foj_stage157_indexed_search.py"
      - "tests/test_foj_resource_table_hypotheses.py"
      - "tests/test_foj_index_column_controls.py"
      - "tests/test_foj_evidence_triage.py"
      - "tests/test_foj_holdout_replication.py"
      - "tests/test_foj_stability_matrix.py"
      - "tests/test_foj_corrupt_container_matrix.py"
      - "tests/test_foj_report_replay_audit.py"
      - "tests/test_foj_report_transit_budget.py"
      - "tests/test_foj_source_coherence_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-unit-tests:
    name: Texture inventory (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reject oversized or unstable source directory listings
        run: python -m unittest discover -s tests -p 'test_foj_bounded_directory_membership.py' -v
      - name: Test fd-relative source directory enumeration
        run: python -m unittest discover -s tests -p 'test_foj_fd_directory_inventory.py' -v
      - name: Reject fd-open path substitution and symlink swaps
        run: python -m unittest discover -s tests -p 'test_foj_fd_bound_reader.py' -v
      - name: Enforce global DDS candidate and JSON byte budgets
        run: python -m unittest discover -s tests -p 'test_foj_global_candidate_budget.py' -v
      - name: Test same-size DDS rewrites and complete two-pass byte replay
        run: python -m unittest discover -s tests -p 'test_foj_two_pass_dds_integrity.py' -v
      - name: Run synthetic DDS metadata scan regressions
        run: python -m unittest discover -s tests -p 'test_foj_texture_probe.py' -v
      - name: Test indexed DDS span and table equivalence under synthetic load
        run: python -m unittest discover -s tests -p 'test_foj_stage157_indexed_search.py' -v
      - name: Test candidate layout and local pointer hints
        run: python -m unittest discover -s tests -p 'test_foj_texture_relations.py' -v
      - name: Test DDS pointer table hypothesis detection
        run: python -m unittest discover -s tests -p 'test_foj_resource_table_hypotheses.py' -v
      - name: Test candidate index columns and negative controls
        run: python -m unittest discover -s tests -p 'test_foj_index_column_controls.py' -v
      - name: Cross-check independent report fields and synthetic contradictions
        run: python -m unittest discover -s tests -p 'test_foj_evidence_triage.py' -v
      - name: Test disjoint private holdout cohorts and non-replication
        run: python -m unittest discover -s tests -p 'test_foj_holdout_replication.py' -v
      - name: Stress deterministic record-count and false-positive variations
        run: python -m unittest discover -s tests -p 'test_foj_stability_matrix.py' -v
      - name: Test damaged DDS headers and broken container reference tables
        run: python -m unittest discover -s tests -p 'test_foj_corrupt_container_matrix.py' -v
      - name: Reject oversized JSON reports at every pipeline handoff
        run: python -m unittest discover -s tests -p 'test_foj_report_transit_budget.py' -v
      - name: Replay four-stage synthetic DDS reports and detect stale edits
        run: python -m unittest discover -s tests -p 'test_foj_report_replay_audit.py' -v
      - name: Verify full local source snapshots and reject mid-pipeline edits
        run: python -m unittest discover -s tests -p 'test_foj_source_coherence_gate.py' -v
      - name: Check Python parser and command-line usage
        run: |
          python -m py_compile tools/foj_fd_bound_reader.py tools/foj_texture_probe.py tools/foj_texture_relations.py tools/foj_resource_table_hypotheses.py tools/foj_index_column_controls.py tools/foj_evidence_triage.py tools/foj_holdout_replication.py tools/foj_stability_matrix.py tools/foj_corrupt_container_matrix.py tools/foj_report_replay_audit.py tools/foj_report_transit_budget.py tools/foj_source_coherence_gate.py tests/test_foj_fd_bound_reader.py tests/test_foj_fd_directory_inventory.py tests/test_foj_bounded_directory_membership.py tests/test_foj_texture_probe.py tests/test_foj_two_pass_dds_integrity.py tests/test_foj_global_candidate_budget.py tests/test_foj_texture_relations.py tests/test_foj_stage157_indexed_search.py tests/test_foj_resource_table_hypotheses.py tests/test_foj_index_column_controls.py tests/test_foj_evidence_triage.py tests/test_foj_holdout_replication.py tests/test_foj_stability_matrix.py tests/test_foj_corrupt_container_matrix.py tests/test_foj_report_replay_audit.py tests/test_foj_report_transit_budget.py tests/test_foj_source_coherence_gate.py
          python -m tools.foj_texture_probe --help
          python -m tools.foj_texture_relations --help
          python -m tools.foj_resource_table_hypotheses --help
          python -m tools.foj_index_column_controls --help
          python -m tools.foj_evidence_triage --help
          python -m tools.foj_holdout_replication --help
          python -m tools.foj_stability_matrix --help
          python -m tools.foj_corrupt_container_matrix --help
          python -m tools.foj_report_replay_audit --help
          python -m tools.foj_source_coherence_gate --help
