name: Stage340 private DDS decoder-to-GPU sampling (generated-only CI)

on:
  pull_request:
    paths:
      - '.github/workflows/stage340-private-dds-gpu.yml'
      - 'gpu/stage340_private_dds_main.c'
      - 'gpu/stage340_private_dds.mk'
      - 'gpu/stage332_dds_source.c'
      - 'gpu/stage332_dds_source.h'
      - 'gpu/stage335_source_staging.c'
      - 'gpu/stage335_source_staging.h'
      - 'gpu/stage336_gpu_copy_plan.c'
      - 'gpu/stage336_gpu_copy_plan.h'
      - 'gpu/stage336_native_upload.c'
      - 'gpu/stage336_native_upload.h'
      - 'gpu/stage339_private_dds_bridge.c'
      - 'gpu/stage339_private_dds_bridge.h'
      - 'tools/foj_stage340_private_dds_gate.py'
      - 'tools/foj_stage340_nexium_drive.sh'
      - 'tests/emulator/test_stage340_private_dds_gate.py'
      - 'docs/GPU_STAGE340_PRIVATE_DDS_GPU.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage340-private-dds-gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host DDS oracle, refusal tests, and source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test generated-only DDS frame oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          python3 -m unittest discover -s tests/emulator -p 'test_stage340_private_dds_gate.py' -v
          for compiler in gcc clang; do
            "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Igpu \
              gpu/stage332_dds_source.c gpu/stage335_source_staging.c \
              gpu/stage336_gpu_copy_plan.c gpu/stage339_private_dds_bridge.c \
              tests/gpu/test_stage339_private_dds_bridge.c \
              -o "/tmp/foj-stage339-$compiler"
            "/tmp/foj-stage339-$compiler"
          done
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -fno-sanitize-recover=all -Igpu \
            gpu/stage332_dds_source.c gpu/stage335_source_staging.c \
            gpu/stage336_gpu_copy_plan.c gpu/stage339_private_dds_bridge.c \
            tests/gpu/test_stage339_private_dds_bridge.c \
            -o /tmp/foj-stage339-sanitized
          /tmp/foj-stage339-sanitized
          python3 -m compileall -q tools/foj_stage340_private_dds_gate.py
          bash -n tools/foj_stage340_nexium_drive.sh
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DFOJ_GPU_DRAW_TRIANGLE=1 -DFOJ_GPU_STAGE340_PRIVATE_DDS_TEXTURE=1 \
            -fsyntax-only -Itests/mock_switch_sdk -Icore -Igpu gpu/stage340_private_dds_main.c
          echo STAGE340_HOST_DDS_ORACLE_AND_FAIL_CLOSED_REFUSAL_PASS

  build:
    name: Build Stage340 private DDS sample NRO and shaders
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Build native Stage340 NRO and validate DKSH
        shell: bash
        run: |
          set -euo pipefail
          make -f gpu/stage340_private_dds.mk verify
          make -f gpu/Makefile triangle-verify
          python3 tools/validate_nro.py build/foj-deko3d-stage340-private-dds.nro
          python3 tools/validate_dksh.py gpu/build/foj_actor.vert.dksh
          python3 tools/validate_dksh.py gpu/build/foj_triangle.frag.dksh
          echo STAGE340_DEVKITA64_PRIVATE_DDS_NRO_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: foj-stage340-private-dds-nro-and-dksh
          path: |
            build/foj-deko3d-stage340-private-dds.nro
            gpu/build/foj_actor.vert.dksh
            gpu/build/foj_triangle.frag.dksh
          if-no-files-found: error
          retention-days: 7

  nexium:
    name: NeXium samples generated DDS via Stage339 and Stage336 (no original assets)
    needs: [host, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foj-stage340-private-dds-nro-and-dksh
          path: native
      - name: Install NeXium Vulkan renderer and screenshot tools
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout --kill-after=15s 360s sudo apt-get "${apt_options[@]}" update
          timeout --kill-after=15s 1500s sudo apt-get "${apt_options[@]}" install -y \
            curl jq xvfb xauth xdotool imagemagick python3-pil \
            libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xkb1 \
            libvulkan1 mesa-vulkan-drivers
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Pin downloaded NeXium binary identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence /tmp/nexium
          release="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          asset="$(printf '%s' "$release" | jq -er \
            '.assets[] | select(.name=="nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$asset" -o /tmp/nexium.tar.gz
          sha256sum /tmp/nexium.tar.gz > runtime-evidence/nexium-archive.sha256
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \
            \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Stage generated DDS only; never fetch private PS3 source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage340-sdroot"
          gpu="$work/sdmc/switch/foj/gpu"
          mkdir -p "$gpu" runtime-evidence/bridge
          cp native/gpu/build/foj_actor.vert.dksh "$gpu/"
          cp native/gpu/build/foj_triangle.frag.dksh "$gpu/"
          python3 -m tools.foj_stage340_private_dds_gate prepare \
            --sd-root "$work/sdmc" --evidence runtime-evidence/bridge
          echo "NEXIUM_DATA_ROOT=$work" >> "$GITHUB_ENV"
          echo "FOJ_NRO=$GITHUB_WORKSPACE/native/build/foj-deko3d-stage340-private-dds.nro" >> "$GITHUB_ENV"
          echo "FOJ_EVIDENCE_DIR=$GITHUB_WORKSPACE/runtime-evidence/bridge" >> "$GITHUB_ENV"
      - name: Capture two GPU frames and independently compare DDS pixels
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 390s xvfb-run -a \
            -s "-screen 0 1280x720x24" bash tools/foj_stage340_nexium_drive.sh
          echo STAGE340_REAL_NEIXIUM_GENERATED_DDS_SAMPLE_PASS
      - name: Publish safe aggregate only; exclude frames, DDS and guest log
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.foj_stage340_private_dds_gate \
            publish --source runtime-evidence --output runtime-evidence-public
          echo STAGE340_GENERATED_DDS_AGGREGATE_ONLY_EXPORT_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foj-stage340-generated-dds-gpu-aggregate-only
          path: runtime-evidence-public/
          if-no-files-found: error
          retention-days: 7
